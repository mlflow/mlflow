// Proto definition for MLflow issue detection support.
// Issues represent quality or operational problems discovered in traces.
syntax = "proto2";

package mlflow.issues;

import "databricks.proto";

option java_package = "org.mlflow.api.proto";
option py_generic_services = true;

// Represents an issue discovered in traces.
message Issue {
  // Unique identifier for the issue.
  optional string issue_id = 1;

  // Experiment ID.
  optional string experiment_id = 2;

  // Short descriptive name for the issue.
  optional string name = 3;

  // Detailed description of the issue.
  optional string description = 4;

  // Issue status.
  optional string status = 5;

  // Severity level indicator.
  optional string severity = 6;

  // Analysis of the root causes of the issue.
  repeated string root_causes = 7 [deprecated = true];

  // MLflow run ID that discovered this issue.
  optional string source_run_id = 8;

  // Creation timestamp in milliseconds.
  optional int64 created_timestamp = 9;

  // Last update timestamp in milliseconds.
  optional int64 last_updated_timestamp = 10;

  // Identifier for who created this issue.
  optional string created_by = 11;

  // Categories of the issue.
  repeated string categories = 12;

  // Number of traces impacted by this issue. Only populated when explicitly requested.
  optional int32 trace_count = 13;

  // Most recent observation, in milliseconds. Independent of user edits.
  optional int64 last_seen_timestamp = 14;
  // Immutable creation provenance. Run sources also populate source_run_id.
  optional string source_type = 15;
  optional string source_id = 16;
  optional string last_updated_by = 17;
  map<string, string> metadata = 18;
  map<string, string> tags = 19;
}

// Request to create a new issue.
message CreateIssue {
  // Experiment ID.
  optional string experiment_id = 1 [(validate_required) = true];

  // Short descriptive name for the issue.
  optional string name = 2 [(validate_required) = true];

  // Detailed description of the issue.
  optional string description = 3 [(validate_required) = true];

  // Issue status.
  optional string status = 4;

  // Severity level indicator.
  optional string severity = 5;

  // Analysis of the root causes of the issue.
  repeated string root_causes = 6 [deprecated = true];

  // MLflow run ID that discovered this issue.
  optional string source_run_id = 7;

  // Identifier for who created this issue.
  optional string created_by = 8;

  // Categories of the issue.
  repeated string categories = 9;
  // Optional caller-assigned iss-* ID. Reuse returns RESOURCE_ALREADY_EXISTS.
  optional string issue_id = 10;
  optional int64 last_seen_timestamp = 11;
  optional string source_type = 12;
  optional string source_id = 13;
  map<string, string> metadata = 14;
  map<string, string> tags = 15;

  message Response {
    // The created issue.
    optional Issue issue = 1;
  }
}

// Request to update an existing issue.
message UpdateIssue {
  // Issue ID to update.
  optional string issue_id = 1 [(validate_required) = true];

  // Short descriptive name for the issue.
  optional string name = 2;

  // Detailed description of the issue.
  optional string description = 3;

  // Issue status to update.
  optional string status = 4;

  // Severity level indicator.
  optional string severity = 5;
  // When supplied, replaces categories; an empty JSON array clears them.
  repeated string categories = 6;
  optional int64 last_seen_timestamp = 7;
  optional string last_updated_by = 8;
  // Merge entries; delete only the explicitly named keys below.
  map<string, string> metadata = 9;
  map<string, string> tags = 10;
  repeated string delete_metadata_keys = 11;
  repeated string delete_tag_keys = 12;

  message Response {
    // The updated issue.
    optional Issue issue = 1;
  }
}

// Request to get an issue by ID.
message GetIssue {
  // Issue ID to fetch.
  optional string issue_id = 1 [(validate_required) = true];

  message Response {
    // The issue.
    optional Issue issue = 1;
  }
}

// Request to search issues.
message SearchIssues {
  // Filter by experiment ID.
  optional string experiment_id = 1;

  // Filter string for advanced filtering.
  optional string filter_string = 2;

  // Maximum number of results to return.
  optional int32 max_results = 3;

  // Page token for pagination.
  optional string page_token = 4;

  // Whether to include the count of traces impacted by each issue.
  optional bool include_trace_count = 5;
  // Case-insensitive literal substring of the issue name.
  optional string name = 6;
  // Values within each list are ORed; different fields are ANDed.
  repeated string statuses = 7;
  repeated string severities = 8;
  repeated string categories = 9;
  map<string, string> tags = 10;
  // Field and ASC/DESC, e.g. "last_seen_timestamp DESC".
  repeated string order_by = 11;
  optional bool include_total_count = 12;
  // "basic" omits description, root_causes and metadata; default "full".
  optional string view = 13;

  message Response {
    // List of issues.
    repeated Issue issues = 1;

    // Token for next page.
    optional string next_page_token = 2;
    optional int64 total_count = 3;
  }
}
