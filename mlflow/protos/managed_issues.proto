// Client-side definitions for the Databricks Issues API.
syntax = "proto2";

package mlflow.managed_issues;

import "databricks.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option py_generic_services = true;

service ManagedIssueService {
  rpc createIssue(CreateIssue) returns (CreateIssue.Response) {
    option (rpc) = {
      endpoints: [
        {
          method: "POST"
          path: "/mlflow/experiments/{experiment}/issues"
        }
      ]
      visibility: PUBLIC_UNDOCUMENTED
      rpc_doc_title: "Create Issue"
    };
  }

  rpc getIssue(GetIssue) returns (GetIssue.Response) {
    option (rpc) = {
      endpoints: [
        {
          method: "GET"
          path: "/mlflow/experiments/{experiment}/issues/{issue}"
        }
      ]
      visibility: PUBLIC_UNDOCUMENTED
      rpc_doc_title: "Get Issue"
    };
  }

  rpc updateIssue(UpdateIssue) returns (UpdateIssue.Response) {
    option (rpc) = {
      endpoints: [
        {
          method: "PATCH"
          path: "/mlflow/experiments/{experiment}/issues/{issue}"
        }
      ]
      visibility: PUBLIC_UNDOCUMENTED
      rpc_doc_title: "Update Issue"
    };
  }

  rpc searchIssues(SearchIssues) returns (SearchIssues.Response) {
    option (rpc) = {
      endpoints: [
        {
          method: "POST"
          path: "/mlflow/experiments/{experiment}/issues:search"
        }
      ]
      visibility: PUBLIC_UNDOCUMENTED
      rpc_doc_title: "Search Issues"
    };
  }

  rpc deleteIssue(DeleteIssue) returns (DeleteIssue.Response) {
    option (rpc) = {
      endpoints: [
        {
          method: "DELETE"
          path: "/mlflow/experiments/{experiment}/issues/{issue}"
        }
      ]
      visibility: PUBLIC_UNDOCUMENTED
      rpc_doc_title: "Delete Issue"
    };
  }
}

message Issue {
  optional string name = 1;
  optional string issue_id = 2;
  optional string title = 3;
  optional string description = 4;
  optional string status = 5;
  optional string severity = 6;
  repeated string categories = 7;
  map<string, string> tags = 8;
  map<string, string> metadata = 9;
  optional google.protobuf.Timestamp last_seen_time = 10;
  optional google.protobuf.Timestamp create_time = 11;
  optional google.protobuf.Timestamp update_time = 12;
  optional string source_type = 13;
  optional string source_id = 14;
  optional string created_by = 15;
  optional string last_updated_by = 16;
}

message CreateIssue {
  optional string parent = 1;
  optional Issue issue = 2;
  optional string issue_id = 3;

  message Response {}
}

message GetIssue {
  optional string name = 1;

  message Response {}
}

message UpdateIssue {
  optional Issue issue = 1;
  optional google.protobuf.FieldMask update_mask = 2;

  message Response {}
}

message SearchIssues {
  message TagFilter {
    optional string key = 1;
    repeated string values = 2;
  }

  optional string parent = 1;
  optional string query = 2;
  repeated string statuses = 3;
  repeated string severities = 4;
  repeated string categories = 5;
  repeated TagFilter tag_filters = 6;
  optional string sort_key = 7;
  optional string sort_order = 8;
  optional int32 page_size = 9;
  optional string page_token = 10;
  optional string view = 11;

  message Response {
    repeated Issue issues = 1;
    optional string next_page_token = 2;
    optional int64 total_size = 3;
  }
}

message DeleteIssue {
  optional string name = 1;
  optional bool force = 2;
  optional string sql_warehouse_id = 3;

  message Response {}
}
