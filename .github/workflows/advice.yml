name: Advice

on:
  pull_request_target:
    types:
      - opened

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

permissions: {}

jobs:
  notify:
    if: >
      !(github.event.pull_request.user.login == 'Copilot' && github.event.pull_request.user.type == 'Bot')
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      pull-requests: write # advice.js comments on PRs
    steps:
      - name: Fetch script
        env:
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          curl -fsSL --retry 3 --connect-timeout 10 --max-time 30 \
            --write-out 'curl: %{time_total}s\n' \
            "https://raw.githubusercontent.com/$REPO/$SHA/.github/workflows/advice.js" \
            -o advice.js
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          retries: 3
          script: |
            const script = require('./advice.js');
            await script({ context, github });
