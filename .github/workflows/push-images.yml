name: Push-Images

on:
  release:
    types:
      - published

concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

permissions: {}
cache-mode: none

jobs:
  push-images:
    # Only run for version tags (vX.Y.Z); skips non-version release tags like `model-catalog/latest`.
    if: "startsWith(github.ref_name, 'v') && !contains(github.ref_name, 'rc')"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      packages: write # to push to ghcr.io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-python

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Gather Docker Metadata for Tracking
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ghcr.io/mlflow/mlflow
          flavor: latest=false
          tags: |
            type=ref,event=tag

      - name: Gather Docker Metadata for Full Image
        id: meta-full
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ghcr.io/mlflow/mlflow
          flavor: latest=false
          tags: |
            type=ref,event=tag,suffix=-full

      - name: Gather Docker Metadata for Model Server
        id: modelmeta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ghcr.io/mlflow/model-server
          flavor: latest=false
          tags: |
            type=ref,event=tag

      - name: Validate image tags
        env:
          BASE_TAGS: ${{ steps.meta.outputs.tags }}
          FULL_TAGS: ${{ steps.meta-full.outputs.tags }}
          MODEL_SERVER_TAGS: ${{ steps.modelmeta.outputs.tags }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          {
            echo "### Versioned image tags"
            echo '```text'
            printf '%s\n%s\n%s\n' "$BASE_TAGS" "$FULL_TAGS" "$MODEL_SERVER_TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          require_tag() {
            local tags=$1
            local expected=$2
            if ! grep -Fxq "$expected" <<< "$tags"; then
              echo "Expected image tag is missing: $expected" >&2
              exit 1
            fi
          }

          require_tag "$BASE_TAGS" "ghcr.io/mlflow/mlflow:$RELEASE_TAG"
          require_tag "$FULL_TAGS" "ghcr.io/mlflow/mlflow:$RELEASE_TAG-full"
          require_tag "$MODEL_SERVER_TAGS" "ghcr.io/mlflow/model-server:$RELEASE_TAG"

          if grep -Exq 'ghcr.io/mlflow/(mlflow:latest(-full)?|model-server:latest)' \
            <<< "$BASE_TAGS"$'\n'"$FULL_TAGS"$'\n'"$MODEL_SERVER_TAGS"; then
            echo "Build metadata must not contain floating image tags" >&2
            exit 1
          fi

      - name: Build and Push Base Image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}

      - name: Build and Push Base Full Image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker
          file: docker/Dockerfile.full
          push: true
          tags: ${{ steps.meta-full.outputs.tags }}
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}

      - name: Build Model Server Image
        run: |
          uv pip install --system .
          mlflow models build-docker -n model-server:latest --mlflow-home `pwd`

      - name: Push Model Server Image
        env:
          TAGS: ${{ steps.modelmeta.outputs.tags }}
        run: |
          set -x

          tags=$(echo -n "$TAGS" | tr '\n' ' ')
          for tag in $tags; do
            docker tag model-server:latest $tag
            docker push $tag
          done

  check-latest:
    needs: push-images
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # to identify GitHub's latest release
    outputs:
      promote: ${{ steps.latest.outputs.promote }}
    steps:
      - name: Check GitHub's latest release
        id: latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          # `gh release create --latest` updates this pointer; `--latest=false` leaves it unchanged.
          # A mismatch or transient API failure fails closed so floating tags are not moved.
          if ! latest_tag=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name); then
            echo "promote=false" >> "$GITHUB_OUTPUT"
            echo "### Floating image promotion skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "Could not read GitHub's latest release. Confirm the latest release and rerun this workflow." \
              >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Could not read GitHub's latest release; floating image promotion failed closed"
            exit 1
          elif [[ "$latest_tag" != "$RELEASE_TAG" ]]; then
            echo "promote=false" >> "$GITHUB_OUTPUT"
            echo "### Floating image promotion skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "Release \`$RELEASE_TAG\` is not GitHub's latest release (\`$latest_tag\`)." \
              >> "$GITHUB_STEP_SUMMARY"
          else
            echo "promote=true" >> "$GITHUB_OUTPUT"
          fi

  promote-latest:
    needs: check-latest
    if: needs.check-latest.outputs.promote == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: push-images-promote-latest
      cancel-in-progress: false
    permissions:
      contents: read # to identify GitHub's latest release
      packages: write # to update tags in ghcr.io
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote floating image tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if ! latest_tag=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name); then
            echo "### Floating image promotion failed" >> "$GITHUB_STEP_SUMMARY"
            echo "Could not re-confirm GitHub's latest release before updating image tags." \
              >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Could not re-confirm GitHub's latest release"
            exit 1
          elif [[ "$latest_tag" != "$RELEASE_TAG" ]]; then
            echo "### Floating image promotion skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "GitHub's latest release changed to \`$latest_tag\` before promotion." \
              >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::GitHub's latest release changed; skipping floating image promotion"
            exit 0
          fi

          docker buildx imagetools create --prefer-index=false \
            --tag ghcr.io/mlflow/mlflow:latest \
            "ghcr.io/mlflow/mlflow:$RELEASE_TAG"
          docker buildx imagetools create --prefer-index=false \
            --tag ghcr.io/mlflow/mlflow:latest-full \
            "ghcr.io/mlflow/mlflow:$RELEASE_TAG-full"
          docker buildx imagetools create --prefer-index=false \
            --tag ghcr.io/mlflow/model-server:latest \
            "ghcr.io/mlflow/model-server:$RELEASE_TAG"

          echo "### Floating image tags promoted" >> "$GITHUB_STEP_SUMMARY"
          echo "Promoted images from release \`$RELEASE_TAG\`." >> "$GITHUB_STEP_SUMMARY"
