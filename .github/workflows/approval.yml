name: Approval

on:
  pull_request_target:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

permissions: {}

jobs:
  check:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - name: Fetch script
        env:
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          mkdir -p .github/workflows
          curl -fsSL --retry 3 --connect-timeout 10 --max-time 30 \
            "https://raw.githubusercontent.com/$REPO/$SHA/.github/workflows/approval.js" \
            -o .github/workflows/approval.js
      - name: Fail without core maintainer approval
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          retries: 3
          script: |
            const script = require(`${process.env.GITHUB_WORKSPACE}/.github/workflows/approval.js`);
            await script({ context, github, core });
