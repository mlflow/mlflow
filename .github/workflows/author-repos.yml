name: Author repos

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to update"
        required: true
        type: number

concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

permissions: {}
cache-mode: none

jobs:
  set-field:
    if: >-
      github.repository == 'mlflow/mlflow' &&
      (github.event_name != 'issues' || github.event.issue.user.type == 'User')
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Set author PR repos field
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
          AUTHOR: ${{ github.event.issue.user.login }}
          # The "Author PR repos (30d)" org issue field (`gh api orgs/mlflow/issue-fields`).
          FIELD_ID: 49034796
        run: |
          author="$AUTHOR"
          if [ -z "$author" ]; then
            read -r author author_type < <(gh api "repos/$REPO/issues/$ISSUE_NUMBER" --jq '"\(.user.login) \(.user.type)"')
            if [ "$author_type" != User ]; then
              echo "Skipping $author ($author_type)"
              exit 0
            fi
          fi
          # Counts only repos the token can see, so effectively public repos plus this one.
          count=$(
            gh api graphql \
              -f login="$author" \
              -f from="$(date -u -d '30 days ago' +%Y-%m-%dT%H:%M:%SZ)" \
              -f to="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              -f query='
                query($login: String!, $from: DateTime!, $to: DateTime!) {
                  user(login: $login) {
                    contributionsCollection(from: $from, to: $to) {
                      pullRequestContributionsByRepository(maxRepositories: 100) {
                        repository { nameWithOwner }
                      }
                    }
                  }
                }' \
              --jq '.data.user.contributionsCollection.pullRequestContributionsByRepository | length'
          )
          # POST (not PUT) so other field values on the issue are kept.
          jq -n --argjson id "$FIELD_ID" --argjson count "$count" \
            '{issue_field_values: [{field_id: $id, value: $count}]}' \
            | gh api -X POST "repos/$REPO/issues/$ISSUE_NUMBER/issue-field-values" --input - > /dev/null
          echo "Set Author PR repos (30d) to $count for $author on #$ISSUE_NUMBER" >> "$GITHUB_STEP_SUMMARY"
