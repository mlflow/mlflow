name: Helm Chart

on:
  push:
    branches: [master, "branch-[0-9]+.[0-9]+"]
    paths:
      - .github/workflows/helm.yml
      - charts/**
      - docker/Dockerfile
      - mlflow/server/**
      - mlflow/tracking/**
      - mlflow/cli/**
  pull_request:
    paths:
      - .github/workflows/helm.yml
      - charts/**
      - docker/Dockerfile
      - mlflow/server/**
      - mlflow/tracking/**
      - mlflow/cli/**

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

permissions: {}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint
        run: helm lint charts/ --set mlflow.backendStoreUri="sqlite:////tmp/mlflow.db"

      - name: Render templates
        run: helm template mlflow charts/ --set mlflow.backendStoreUri="sqlite:////tmp/mlflow.db"

      - name: Render Service port
        run: |
          render() {
            helm template mlflow charts/ \
              --set mlflow.backendStoreUri="sqlite:////tmp/mlflow.db" "$@" \
              -s templates/service.yaml
          }
          # Defaults to server.value_options.port when unset.
          render | grep -q '^    - port: 5000$'
          render --set service.port=80 | grep -q '^    - port: 80$'

      - name: Render CronJob with a decoupled Service port
        run: |
          render() {
            helm template mlflow charts/ \
              --set mlflow.backendStoreUri="sqlite:////tmp/mlflow.db" \
              --set garbageCollection.enabled=true \
              --set fullnameOverride=mlflow "$@" \
              -s templates/cronjob.yaml
          }
          # MLFLOW_TRACKING_URI must reach the Service on its own port, not
          # the container port, once they're decoupled.
          render | grep -q 'mlflow.default.svc.cluster.local:5000'
          render --set service.port=80 | grep -q 'mlflow.default.svc.cluster.local:80'

      - name: Render ServiceMonitor
        run: |
          render() {
            helm template mlflow charts/ \
              --set mlflow.backendStoreUri="sqlite:////tmp/mlflow.db" \
              --set metrics.enabled=true \
              --set serviceMonitor.enabled=true "$@"
          }
          render | grep -q '^      path: /metrics$'
          render --set metrics.path=/custom | grep -q '^      path: /custom$'
          # An unset path must not render as an empty value, which strict schema
          # validation rejects as null.
          render --set metrics.path= | grep -q '^      path: /metrics$'

      - name: Render probes
        run: |
          render() {
            helm template mlflow charts/ \
              --set mlflow.backendStoreUri="sqlite:////tmp/mlflow.db" "$@"
          }
          # Extract just one probe's rendered field block (the 10-space-indented
          # keys under e.g. "readinessProbe:") so assertions can't accidentally
          # match a sibling probe or another part of the manifest.
          probe_block() {
            awk -v key="^          $1\$" '
              $0 ~ key { infield=1; next }
              infield && /^          [A-Za-z]/ { infield=0 }
              infield { print }
            '
          }

          # All three probes render by default, with the chart-owned /health path.
          default=$(render)
          echo "$default" | grep -q '^          livenessProbe:$'
          echo "$default" | grep -q '^          readinessProbe:$'
          echo "$default" | grep -q '^          startupProbe:$'
          echo "$default" | grep -q '^              path: /health$'
          # A 0-valued field must still render (the reason for hasKey over `with`):
          # the startup probe's initialDelaySeconds: 0 must appear, not be dropped.
          echo "$default" | probe_block 'startupProbe:' | grep -q '^            initialDelaySeconds: 0$'

          # enabled: false cleanly omits a probe. Capture the render into a
          # variable first (rather than piping straight into the `if`) so a
          # `helm template` failure stays fatal instead of looking identical
          # to "the probe was correctly omitted".
          disabled=$(render --set probes.startup.enabled=false)
          if echo "$disabled" | grep -q 'startupProbe:'; then
            echo "startupProbe should have been omitted" >&2
            exit 1
          fi

          # TLS and staticPrefix flow through to the probe's httpGet request.
          tls=$(render --set tls.enabled=true --set server.staticPrefix=/mlflow)
          echo "$tls" | probe_block 'livenessProbe:' | grep -q '^              path: /mlflow/health$'
          echo "$tls" | probe_block 'livenessProbe:' | grep -q '^              scheme: HTTPS$'

          # Threshold/timing overrides are honored, scoped to the probe they
          # target so a misrouted override can't slip past this check.
          overridden=$(render --set probes.readiness.failureThreshold=9)
          echo "$overridden" | probe_block 'readinessProbe:' | grep -q '^            failureThreshold: 9$'

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        tls: [false, true]
    name: e2e (tls=${{ matrix.tls }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create Kind cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0

      - name: Get MLflow version
        id: version
        run: |
          echo "version=$(grep '^appVersion' charts/Chart.yaml | awk '{print $2}' | tr -d '"')" >> $GITHUB_OUTPUT

      - name: Build Docker image
        env:
          MLFLOW_VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker build \
            --build-arg VERSION=$MLFLOW_VERSION \
            -t mlflow:ci \
            docker/

      - name: Load image into Kind
        run: kind load docker-image mlflow:ci --name chart-testing

      - name: Generate TLS certificate
        if: matrix.tls == true
        run: |
          openssl req -x509 -newkey rsa:2048 -keyout tls.key -out tls.crt -days 1 -nodes \
            -subj "/CN=localhost"
          kubectl create secret tls mlflow-tls --cert=tls.crt --key=tls.key

      - name: Deploy chart
        env:
          TLS_FLAGS: ${{ matrix.tls == true && '--set tls.enabled=true --set tls.secretName=mlflow-tls' || '' }}
        run: |
          helm install mlflow charts/ \
            --set image.repository=mlflow \
            --set image.tag=ci \
            --set image.pullPolicy=Never \
            --set fullnameOverride=mlflow \
            --set mlflow.backendStoreUri=sqlite:////tmp/mlflow.db \
            --set mlflow.artifactsDestination=/tmp/mlartifacts \
            $TLS_FLAGS \
            --wait \
            --timeout 5m

      - name: Verify MLflow is reachable
        env:
          SCHEME: ${{ matrix.tls == true && 'https' || 'http' }}
          CURL_FLAGS: ${{ matrix.tls == true && '--insecure' || '' }}
        run: |
          kubectl port-forward svc/mlflow 5000:5000 &
          curl --retry 10 --retry-connrefused --retry-delay 3 --fail $CURL_FLAGS ${SCHEME}://localhost:5000/health

      - name: Print container logs
        if: always()
        run: kubectl logs -l app.kubernetes.io/name=mlflow --tail=-1
