name: Cross version tests

on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "dev/clint/**"
      - ".github/workflows/copilot-*.yml"
      - ".github/workflows/docs.yml"
      - ".github/workflows/preview-docs.yml"
      - ".github/workflows/triage.yml"
      - "mlflow/server/js/**"
      - ".github/workflows/js.yml"
      - "libs/typescript/**"
      - ".github/workflows/typescript.yml"
      - ".claude/**"
  workflow_dispatch:
    inputs:
      repository:
        description: >
          [Optional] Repository name with owner. For example, mlflow/mlflow.
           Defaults to the repository that triggered a workflow.
        required: false
        default: ""
      ref:
        description: >
          [Optional] The branch, tag or SHA to checkout. When checking out the repository that
           triggered a workflow, this defaults to the reference or SHA for that event. Otherwise,
           uses the default branch.
        required: false
        default: ""
      flavors:
        description: "[Optional] Comma-separated string specifying which flavors to test (e.g. 'sklearn, xgboost'). If unspecified, all flavors are tested."
        required: false
        default: ""
      versions:
        description: "[Optional] Comma-separated string specifying which versions to test (e.g. '1.2.3, 4.5.6'). If unspecified, all versions are tested."
        required: false
        default: ""
  schedule:
    - cron: "0 2 * * *"
      timezone: "Asia/Tokyo"

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  MLFLOW_HOME: ${{ github.workspace }}
  PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
  PIP_CONSTRAINT: ${{ github.workspace }}/requirements/constraints.txt

permissions: {}
cache-mode: none

jobs:
  set-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.repository == 'mlflow/mlflow') || github.event_name == 'pull_request'
    permissions:
      actions: read
      contents: read
    outputs:
      previous_run_id: ${{ steps.previous-run.outputs.run_id }}
      previous_run_lookup_outcome: ${{ steps.previous-run.outcome }}
      matrix1: ${{ steps.set-matrix.outputs.matrix1 }}
      matrix2: ${{ steps.set-matrix.outputs.matrix2 }}
      is_matrix1_empty: ${{ steps.set-matrix.outputs.is_matrix1_empty }}
      is_matrix2_empty: ${{ steps.set-matrix.outputs.is_matrix2_empty }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ${{ github.event_name == 'schedule' && 'mlflow/mlflow' || github.event.inputs.repository }}
          ref: ${{ github.event.inputs.ref }}
      - uses: ./.github/actions/untracked
      - uses: ./.github/actions/setup-python
      - name: Install flavors
        run: |
          uv sync --package flavors
      - name: Check labels
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        id: check-labels
        with:
          retries: 3
          script: |
            if (context.eventName !== "pull_request") {
              return {
                enable_dev_tests: true,
                only_latest: false,
              };
            }
            const labelNames = context.payload.pull_request.labels.map(l => l.name);
            return {
              enable_dev_tests: labelNames.includes("enable-dev-tests"),
              only_latest: labelNames.includes("only-latest"),
            };
      - name: Test flavors CLI
        run: |
          uv run --no-sync pytest --noconftest dev/flavors/tests
      - name: Find previous scheduled run
        id: previous-run
        if: github.event_name == 'schedule'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          previous_run_id=$(gh api --method GET --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/actions/workflows/cross-version-tests.yml/runs" \
            -f branch="$GITHUB_REF_NAME" -f event=schedule -f status=completed -F per_page=100 |
            jq --raw-output --argjson current "$GITHUB_RUN_NUMBER" \
              '[.[].workflow_runs[] | select(.run_number < $current)] | max_by(.run_number).id // empty')
          echo "run_id=$previous_run_id" >> "$GITHUB_OUTPUT"
      - id: set-matrix
        name: Set matrix
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.base_ref }}
          ENABLE_DEV_TESTS: ${{ fromJson(steps.check-labels.outputs.result).enable_dev_tests }}
          ONLY_LATEST: ${{ fromJson(steps.check-labels.outputs.result).only_latest }}
          FLAVORS: ${{ github.event.inputs.flavors }}
          VERSIONS: ${{ github.event.inputs.versions }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            REF_VERSIONS_YAML=/tmp/ref-versions.yml
            git fetch origin "$BASE_REF" --depth=1
            git show "origin/$BASE_REF:mlflow/ml-package-versions.yml" > "$REF_VERSIONS_YAML"
            CHANGED_FILES=$(gh pr view "$PR_NUMBER" --json files --jq '.files[].path' | grep -v '^mlflow/server/js' || true)
            NO_DEV_FLAG=$([ "$ENABLE_DEV_TESTS" == "true" ] && echo "" || echo "--no-dev")
            ONLY_LATEST_FLAG=$([ "$ONLY_LATEST" == "true" ] && echo "--only-latest" || echo "")
            uv run --no-sync flavors matrix --ref-versions-yaml "$REF_VERSIONS_YAML" --changed-files "$CHANGED_FILES" $NO_DEV_FLAG $ONLY_LATEST_FLAG
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            uv run --no-sync flavors matrix --flavors "$FLAVORS" --versions "$VERSIONS"
          else
            uv run --no-sync flavors matrix
          fi

  test1:
    needs: set-matrix
    if: needs.set-matrix.outputs.is_matrix1_empty == 'false'
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 120
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.set-matrix.outputs.matrix1) }}
    steps: &test-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ${{ github.event_name == 'schedule' && 'mlflow/mlflow' || github.event.inputs.repository }}
          ref: ${{ github.event.inputs.ref }}
      - uses: ./.github/actions/free-disk-space
        if: matrix.free_disk_space
      - uses: ./.github/actions/setup-python
        with:
          python-version: ${{ matrix.python }}
          pin-micro-version: true
      - uses: ./.github/actions/setup-pyenv
      - uses: ./.github/actions/setup-java
        with:
          java-version: ${{ matrix.java }}
      - name: Remove constraints
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          # Remove any constraints for the current package to prevent installation conflicts
          sed -i '/^'"$PACKAGE"'/d' requirements/constraints.txt
          sed -i '/^constraint-dependencies = \[/,/^\]/{ /'"$PACKAGE"'/d }' pyproject.toml

          if ! git diff --exit-code requirements/constraints.txt pyproject.toml; then
            git diff
            git config user.name 'mlflow-app[bot]'
            git config user.email 'mlflow-app[bot]@users.noreply.github.com'
            git add requirements/constraints.txt pyproject.toml
            git commit -m "Remove constraints for testing"
          fi
      - name: Install mlflow & test dependencies
        env:
          MATRIX_CATEGORY: ${{ matrix.category }}
        run: |
          # setuptools 82.0.0 removed pkg_resources, this breaking change breaks some packages like transformers
          uv pip install --system -U wheel "setuptools<82"
          # For tracing SDK test, install the tracing package from the local path and minimal test dependencies
          if [[ "$MATRIX_CATEGORY" == "tracing-sdk" ]]; then
            uv pip install --system libs/tracing
            uv pip install --system pytest pytest-asyncio pytest-cov
          # Other two categories of tests (model/autologging)
          else
            uv pip install --system .[extras]
            uv pip install --system -r requirements/test-requirements.txt
          fi
      - name: Install ${{ matrix.package }} ${{ matrix.version }}
        env:
          MATRIX_INSTALL: ${{ matrix.install }}
        run: |
          eval "$MATRIX_INSTALL"
      - uses: ./.github/actions/show-versions
        with:
          output-json: ${{ github.event_name == 'schedule' && 'snapshot.json' || '' }}
      - name: Upload snapshot
        if: github.event_name == 'schedule' && !cancelled() && hashFiles('snapshot.json') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snapshot-${{ matrix.name }}-${{ matrix.category }}-${{ matrix.version }}
          path: snapshot.json
          retention-days: 7
          if-no-files-found: error
          overwrite: true
      - name: Show snapshot changes
        if: github.event_name == 'schedule' && !cancelled() && hashFiles('snapshot.json') != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREVIOUS_RUN_ID: ${{ needs.set-matrix.outputs.previous_run_id }}
          PREVIOUS_RUN_LOOKUP_OUTCOME: ${{ needs.set-matrix.outputs.previous_run_lookup_outcome }}
          ARTIFACT_NAME: snapshot-${{ matrix.name }}-${{ matrix.category }}-${{ matrix.version }}
        run: |
          echo '>>> snapshot changes'
          trap 'echo "<<< snapshot changes"' EXIT
          if [[ "$PREVIOUS_RUN_LOOKUP_OUTCOME" != 'success' ]]; then
            echo 'Previous run lookup failed; comparison skipped. See the set-matrix job diagnostics.'
            exit 1
          fi
          if [[ -z "$PREVIOUS_RUN_ID" ]]; then
            echo 'No baseline: no earlier completed scheduled run available.'
            exit 0
          fi
          echo "Baseline: [$PREVIOUS_RUN_ID]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$PREVIOUS_RUN_ID)"
          previous_dir=$(mktemp -d "$RUNNER_TEMP/previous-snapshot.XXXXXX")
          if ! gh run download "$PREVIOUS_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "$ARTIFACT_NAME" --dir "$previous_dir"; then
            echo 'Could not retrieve the baseline snapshot; see the gh diagnostic above. Comparison skipped.'
            exit 0
          fi
          if ! jq --exit-status '.packages | objects | select(all(.[]; type == "string"))' "$previous_dir/snapshot.json" > "$previous_dir/previous.json"; then
            echo 'Invalid baseline snapshot packages; comparison skipped.'
            exit 1
          fi
          if ! jq --exit-status '.packages | objects | select(all(.[]; type == "string"))' snapshot.json > "$previous_dir/current.json"; then
            echo 'Invalid current snapshot packages; comparison skipped.'
            exit 1
          fi
          jq --null-input --raw-output \
            --slurpfile previous "$previous_dir/previous.json" \
            --slurpfile current "$previous_dir/current.json" '
            $previous[0] as $old | $current[0] as $new
            | ($old + $new | keys[]) as $name
            | select($old[$name] != $new[$name])
            | if $old[$name] == null then "Added \($name) v\($new[$name])"
              elif $new[$name] == null then "Removed \($name) v\($old[$name])"
              else "Updated \($name) v\($old[$name]) -> v\($new[$name])"
              end
          ' > "$previous_dir/changes.txt"
          if [[ -s "$previous_dir/changes.txt" ]]; then
            cat "$previous_dir/changes.txt"
          else
            echo 'No package changes.'
          fi
      - name: Pre-test
        if: matrix.pre_test
        env:
          MATRIX_PRE_TEST: ${{ matrix.pre_test }}
        run: |
          eval "$MATRIX_PRE_TEST"
      - name: Run tests
        env:
          MLFLOW_CONDA_HOME: /usr/share/miniconda
          SPARK_LOCAL_IP: localhost
          HF_HUB_ENABLE_HF_TRANSFER: 1
          MATRIX_RUN: ${{ matrix.run }}
        run: |
          eval "$MATRIX_RUN"

  test2:
    needs: set-matrix
    if: needs.set-matrix.outputs.is_matrix2_empty == 'false'
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 120
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.set-matrix.outputs.matrix2) }}
    steps: *test-steps
