# Comment on newly opened issues with links to likely duplicates.
#
# Split into two jobs so prompt injection in an issue body cannot become a write:
# - `dedupe` runs Claude with read-only permissions and writes a comment body to
#   a local file.
# - `comment` holds `issues: write` and posts that file.
#
# The body crosses between them base64-encoded, so no line in it can terminate
# the $GITHUB_OUTPUT heredoc and inject further outputs.

name: dedupe

on:
  issues:
    types: [opened]
  pull_request:
    paths:
      - .github/workflows/dedupe.yml
      - .claude/skills/issue-dedupe/**

concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

permissions: {}

jobs:
  # On pull_request this runs end-to-end against the newest open issue as a smoke
  # test. The `comment` job is skipped there, so nothing is posted.
  dedupe:
    if: >
      (github.event_name == 'issues' && github.event.issue.user.type != 'Bot')
      || (github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: read
    outputs:
      issue_number: ${{ steps.target.outputs.issue_number }}
      comment: ${{ steps.claude.outputs.comment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .claude

      - name: Resolve target issue
        id: target
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$EVENT_NAME" = "issues" ]; then
            number="$ISSUE_NUMBER"
          else
            # Smoke test: dedupe whatever issue was opened most recently, so the
            # target stays valid without anyone maintaining a fixture.
            number=$(gh issue list --repo "$REPO" --state open --limit 1 --json number --jq '.[0].number')
          fi
          echo "issue_number=$number" >> "$GITHUB_OUTPUT"

      - name: Install Claude CLI
        run: |
          .claude/scripts/install-claude.sh

      - name: Find duplicates
        id: claude
        env:
          # Read-only token: prompt injection in the issue body cannot post,
          # label, or close anything.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.EXPERIMENTAL_ANTHROPIC_API_KEY }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ steps.target.outputs.issue_number }}
        run: |
          OUTPUT_FILE="/tmp/output.jsonl"
          EXIT_CODE=0
          timeout 10m claude \
            --model claude-sonnet-4-6 \
            --effort medium \
            --max-budget-usd 1 \
            --print \
            --verbose \
            --output-format stream-json \
            "/issue-dedupe $REPO $ISSUE_NUMBER" \
            | .claude/scripts/stream.sh "$OUTPUT_FILE" || EXIT_CODE=$?
          if [ "${EXIT_CODE:-0}" -eq 124 ]; then
            echo "Warning: Claude command timed out after 10 minutes"
          elif [ "${EXIT_CODE:-0}" -ne 0 ]; then
            echo "Error: Claude command failed with exit code $EXIT_CODE"
            cat "$OUTPUT_FILE"
            exit $EXIT_CODE
          fi

          # No file means no duplicates worth reporting, which is the common case.
          if [ -s /tmp/dedupe-comment.md ]; then
            echo "comment=$(base64 -w0 /tmp/dedupe-comment.md)" >> "$GITHUB_OUTPUT"
            cat /tmp/dedupe-comment.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No duplicates found" >> "$GITHUB_STEP_SUMMARY"
          fi

  comment:
    needs: dedupe
    if: github.event_name == 'issues' && needs.dedupe.outputs.comment != ''
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Post duplicates comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ needs.dedupe.outputs.issue_number }}
          COMMENT: ${{ needs.dedupe.outputs.comment }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            base64 -d <<< "$COMMENT"
            echo
            echo "---"
            echo "🤖 This comment was generated by AI and may be incorrect. A maintainer will review."
            echo "[Workflow run]($RUN_URL)"
          } | gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body-file -
