name: PR Size Labeling

on:
  pull_request_target:
    types:
      - opened
      - closed
      - ready_for_review
      - review_requested

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

permissions: {}

jobs:
  label-pr-size:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-slim
    permissions:
      pull-requests: write
      issues: write
    timeout-minutes: 5
    steps:
      - name: Fetch script
        env:
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          curl -fsSL --retry 3 --connect-timeout 10 --max-time 30 \
            --write-out 'curl: %{time_total}s\n' \
            "https://raw.githubusercontent.com/$REPO/$SHA/.github/workflows/pr-size.js" \
            -o pr-size.js
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          retries: 3
          script: |
            const script = require('./pr-size.js');
            await script({ github, context });
