# Cancel workflow runs associated with a pull request when it is closed or merged.
name: Cancel

on:
  pull_request_target:
    types:
      - closed

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

permissions: {}
cache-mode: none

jobs:
  cancel:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      actions: write # to cancel workflow runs
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
        run: |
          run_ids=$(
            gh api --paginate \
              "repos/$REPO/actions/runs?head_sha=$HEAD_SHA&event=pull_request&per_page=100" \
              --jq '.workflow_runs[] | select(.status != "completed" and .name != "release-note") | .id'
          )

          if [ -n "$run_ids" ]; then
            while read -r run_id; do
              (
                echo "Cancelling https://github.com/$REPO/actions/runs/$run_id"
                gh run cancel "$run_id" --repo "$REPO" || true
              ) &
            done <<< "$run_ids"
          fi
          wait
