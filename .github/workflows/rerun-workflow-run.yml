# Triggered by rerun.yml on PR approval.
name: rerun-workflow-run
on:
  workflow_run:
    workflows: [rerun]
    types: [completed]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

permissions: {}
cache-mode: none

jobs:
  rerun:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      actions: write # to rerun workflows
      checks: read # to read check runs
      contents: read # to resolve the triggering commit
    steps:
      - name: Rerun failed checks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # Adapted from gh pr checks, targeting a fixed SHA and GitHub Actions:
          # Query: https://github.com/cli/cli/blob/0cf1092493af067646fc5f3db9421c6a6ec9c938/api/query_builder.go#L270-L312
          # Deduplication: https://github.com/cli/cli/blob/0cf1092493af067646fc5f3db9421c6a6ec9c938/pkg/cmd/pr/checks/aggregate.go#L95-L120
          pages=$(gh api graphql --paginate --slurp \
            -f owner="${GH_REPO%/*}" -f name="${GH_REPO#*/}" -f sha="$HEAD_SHA" \
            -f query='
              query($owner: String!, $name: String!, $sha: String!, $endCursor: String) {
                repository(owner: $owner, name: $name) {
                  object(expression: $sha) {
                    ... on Commit {
                      statusCheckRollup {
                        contexts(first: 100, after: $endCursor) {
                          nodes {
                            __typename
                            ... on CheckRun {
                              name
                              status
                              conclusion
                              startedAt
                              completedAt
                              detailsUrl
                              checkSuite {
                                app { slug }
                                workflowRun { event workflow { name } }
                              }
                            }
                          }
                          pageInfo { hasNextPage endCursor }
                        }
                      }
                    }
                  }
                }
              }')

          # Deduplicate across all pages before filtering failures, so a newer
          # successful or pending check suppresses a superseded failure.
          rows=$(jq -r '
            [ .[].data.repository.object.statusCheckRollup.contexts.nodes[]?
              | select(.__typename == "CheckRun")
              | select(.checkSuite.app.slug == "github-actions") ]
            | group_by([.name, .checkSuite.workflowRun.workflow.name,
                        .checkSuite.workflowRun.event])
            | map(max_by(.startedAt // ""))
            | .[]
            | select(.status == "COMPLETED" and .conclusion == "FAILURE")
            | select((.name | ascii_downcase) != "rerun")
            | select(
                (.name | ascii_downcase) == "protect"
                or ((.completedAt | fromdateiso8601) - (.startedAt | fromdateiso8601)) <= 60
              )
            | "\(.detailsUrl | capture("/actions/runs/(?<id>[0-9]+)").id) \(.name | ascii_downcase)"
          ' <<< "$pages" | sort -u -k1,1)

          rerun() {
            echo "Rerunning https://github.com/$GH_REPO/actions/runs/$1"
            gh run rerun "$1" --failed --repo "$GH_REPO" || echo "Failed to rerun $1"
          }

          # Several failed jobs can belong to one workflow run. Submit each run
          # once, and protect last because it polls the other checks for failures.
          protect_id=""
          if [ -n "$rows" ]; then
            while read -r id name; do
              if [ "$name" = "protect" ]; then
                protect_id=$id
              else
                rerun "$id" &
              fi
            done <<< "$rows"
          fi

          wait
          if [ -n "$protect_id" ]; then
            rerun "$protect_id"
          fi
