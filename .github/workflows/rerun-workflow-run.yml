# Triggered by rerun.yml on PR approval.
name: rerun-workflow-run
on:
  workflow_run:
    workflows: [rerun]
    types: [completed]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

permissions: {}
cache-mode: none

jobs:
  rerun:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      actions: write # to rerun workflows
    steps:
      - name: Rerun failed checks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          pages=$(gh api graphql --paginate --slurp \
            -f owner="${GH_REPO%/*}" -f name="${GH_REPO#*/}" -f sha="$HEAD_SHA" \
            -f query='
              query($owner: String!, $name: String!, $sha: String!, $endCursor: String) {
                repository(owner: $owner, name: $name) {
                  object(expression: $sha) {
                    ... on Commit {
                      statusCheckRollup {
                        contexts(first: 100, after: $endCursor) {
                          nodes {
                            ... on CheckRun {
                              name
                              status
                              conclusion
                              startedAt
                              completedAt
                              checkSuite {
                                app { slug }
                                workflowRun {
                                  databaseId
                                  event
                                  createdAt
                                  workflow { resourcePath }
                                }
                              }
                            }
                          }
                          pageInfo { hasNextPage endCursor }
                        }
                      }
                    }
                  }
                }
              }')

          # Keep the newest run per workflow/event, then the latest attempt of each job.
          # Only rerun workflows whose failed jobs all finished within 60 seconds.
          rows=$(jq -r '
            def failed:
              .conclusion == "FAILURE" or .conclusion == "TIMED_OUT"
              or .conclusion == "STARTUP_FAILURE";
            [ .[].data.repository.object.statusCheckRollup.contexts.nodes[]?
              | select(.checkSuite.app.slug == "github-actions"
                       and .checkSuite.workflowRun != null)
              | select(.checkSuite.workflowRun.event != "dynamic") ]
            | group_by([.checkSuite.workflowRun.workflow.resourcePath,
                        .checkSuite.workflowRun.event])
            | map(group_by(.checkSuite.workflowRun.databaseId)
                  | max_by([.[0].checkSuite.workflowRun.createdAt,
                            .[0].checkSuite.workflowRun.databaseId]))
            | .[]
            | group_by(.name)
            | map(max_by(.startedAt // ""))
            | select(all(.[]; .status == "COMPLETED"))
            | select(any(.[]; failed))
            | .[0].checkSuite.workflowRun as $run
            | select($run.workflow.resourcePath |
                endswith("/rerun-workflow-run.yml") or endswith("/retry.yml") | not)
            | ($run.workflow.resourcePath | endswith("/protect.yml")) as $protect
            | select($protect or all(.[] | select(failed);
                (try (((.completedAt | fromdateiso8601) - (.startedAt | fromdateiso8601))
                      | . >= 0 and . <= 60) catch false)))
            | "\($run.databaseId) \($protect)"
          ' <<< "$pages")

          rerun() {
            echo "Rerunning https://github.com/$GH_REPO/actions/runs/$1"
            gh run rerun "$1" --failed --repo "$GH_REPO" || echo "Failed to rerun $1"
          }

          # Submit Protect last because it polls the other checks for failures.
          protect_id=""
          if [ -n "$rows" ]; then
            while read -r id protect; do
              if [ "$protect" = "true" ]; then
                protect_id=$id
              else
                rerun "$id" &
              fi
            done <<< "$rows"
          fi

          wait
          if [ -n "$protect_id" ]; then
            rerun "$protect_id"
          fi
