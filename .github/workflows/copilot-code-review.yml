# This workflow configures the environment used by Copilot code review.
# Find recent review runs with:
#
# gh api '/repos/mlflow/mlflow/actions/runs?event=dynamic&per_page=100' \
#   --jq '.workflow_runs[]
#     | select(.path == "dynamic/agents/copilot-pull-request-reviewer")
#     | {id, name, created_at, conclusion, html_url}'

name: copilot-code-review

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/copilot-code-review.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

permissions: {}
cache-mode: none

jobs:
  # Must be named `copilot-setup-steps` even in this file, otherwise Copilot
  # ignores it and falls back to `copilot-setup-steps.yml`.
  copilot-setup-steps:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python
        with:
          pin-micro-version: false
      - uses: ./.github/actions/setup-node
