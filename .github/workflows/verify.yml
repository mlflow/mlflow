# Preview a branch: gh workflow run verify.yml --ref <branch> -F pr_number=<number>
# Add -F dry_run=false to publish the review on the specified PR.
name: Verify

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to verify"
        required: true
        type: number
      model:
        description: "AI Gateway Claude model"
        required: false
        type: choice
        default: databricks-claude-sonnet-5-5
        options:
          - databricks-claude-opus-5-5
          - databricks-claude-sonnet-5-5
          - databricks-claude-haiku-5-5
      effort:
        description: "Reasoning effort"
        required: false
        type: choice
        default: medium
        options: [low, medium, high, xhigh, max]
      dry_run:
        description: "Preview without posting a review or uploading media"
        required: false
        type: boolean
        default: true

concurrency:
  # Queue verification per PR; give unrelated events unique groups so they don't delay it.
  # Examples:
  # - verify-12345: workflow dispatch or /verify on PR #12345
  # - verify-ignored-123456789: unrelated event with run ID 123456789
  group: >-
    ${{ format('verify-{0}',
      github.event_name == 'workflow_dispatch' && inputs.pr_number ||
      github.event.issue.pull_request != null && github.event.issue.state == 'open' &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
      startsWith(github.event.comment.body, '/verify') && github.event.issue.number ||
      format('ignored-{0}', github.run_id)) }}
  cancel-in-progress: false
  queue: max

defaults:
  run:
    shell: bash

permissions: {}
cache-mode: none

jobs:
  gate:
    if: >-
      github.repository == 'mlflow/mlflow' && vars.VERIFY_DISABLED != 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.issue.pull_request != null && github.event.issue.state == 'open' &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
        startsWith(github.event.comment.body, '/verify')))
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    outputs:
      allowed: ${{ steps.pr.outputs.allowed }}
      head: ${{ steps.pr.outputs.head }}
    steps:
      # The workflow ref is the default branch for /verify and the selected ref for dispatch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .claude/skills/verify
            .claude/scripts
      - name: Check authorization and snapshot PR
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number || inputs.pr_number }}
          COMMENT: ${{ github.event_name == 'workflow_dispatch' && '/verify' || github.event.comment.body }}
        run: |
          python3 .claude/skills/verify/scripts/cli.py collect --repo "$REPO" --pr-number "$PR_NUMBER" \
            --comment "$COMMENT" --out-path "$RUNNER_TEMP/pr_context.json"
      - name: Add run link to trigger comment
        if: steps.pr.outputs.allowed == 'true' && github.event_name == 'issue_comment'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          COMMENT_ID: ${{ github.event.comment.id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}?pr=${{ github.event.issue.number }}
        run: |
          marker="<!-- verify-run:$GITHUB_RUN_ID -->"
          body=$(gh api "repos/$REPO/issues/comments/$COMMENT_ID" --jq .body)
          if [[ "$body" != *"$marker"* ]]; then
            body=$(printf '%s\n\n---\n\n[Verification run](%s) %s' "$body" "$RUN_URL" "$marker")
            gh api "repos/$REPO/issues/comments/$COMMENT_ID" -X PATCH -f body="$body" > /dev/null
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.pr.outputs.allowed == 'true'
        with:
          name: verify-in-${{ github.run_id }}
          path: ${{ runner.temp }}/pr_context.json
          overwrite: true
          if-no-files-found: error
          retention-days: 1

  verify:
    needs: gate
    if: needs.gate.outputs.allowed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      VERIFY_TMP_DIR: /tmp/verify
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
    steps:
      # The workflow ref is the default branch for /verify and the selected ref for dispatch.
      - parallel:
          - name: Checkout trusted workflow files
            id: trusted
            uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            with:
              ref: ${{ github.sha }}
              path: trusted
              persist-credentials: false
          - name: Checkout PR merge
            uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            with:
              ref: refs/pull/${{ github.event.issue.number || inputs.pr_number }}/merge
              path: pr
              persist-credentials: false
              fetch-depth: 2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verify-in-${{ github.run_id }}
          path: ${{ env.VERIFY_TMP_DIR }}/in
      - uses: ./trusted/.github/actions/setup-python
      - uses: ./trusted/.github/actions/setup-node
      - name: Prepare PR diff
        env:
          HEAD_SHA: ${{ needs.gate.outputs.head }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number || inputs.pr_number }}
        working-directory: pr
        run: |
          if [ "$(git rev-parse HEAD^2)" != "$HEAD_SHA" ]; then
            echo '::error::PR head changed before checkout; run /verify again.'
            exit 1
          fi
          gh pr diff "$PR_NUMBER" --repo "$REPO" \
            | "$GITHUB_WORKSPACE/trusted/.claude/scripts/mask-diff.sh" > "$VERIFY_TMP_DIR/in/pr.diff"
          pr=$(gh api "repos/$REPO/pulls/$PR_NUMBER")
          if ! jq -e --arg head "$HEAD_SHA" '.head.sha == $head' <<< "$pr" > /dev/null; then
            echo '::error::PR head changed while fetching the diff; run /verify again.'
            exit 1
          fi
      - name: Install agent tools
        run: |
          trusted/.claude/scripts/install-claude.sh
          trusted/.claude/scripts/install-agent-browser.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install FFmpeg
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          trusted/.claude/scripts/install-ffmpeg.sh
      - id: gateway
        uses: ./trusted/.github/actions/setup-gateway
        with:
          task: pr-verify
          host: ${{ secrets.DATABRICKS_HOST }}
          client-id: ${{ secrets.DATABRICKS_CLIENT_ID }}
          client-secret: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
      - name: Start gateway proxy
        id: gateway-proxy
        env:
          GATEWAY_TOKEN: ${{ steps.gateway.outputs.token }}
          GATEWAY_URL: ${{ steps.gateway.outputs.base-url }}
        run: |
          placeholder_token=$(openssl rand -hex 32)
          echo "::add-mask::$placeholder_token"
          printf 'placeholder-token=%s\n' "$placeholder_token" >> "$GITHUB_OUTPUT"
          printf '%s\n%s\n' "$GATEWAY_TOKEN" "$placeholder_token" | env -u GATEWAY_TOKEN \
            GATEWAY_URL="$GATEWAY_URL" node trusted/.claude/sandbox/gateway-proxy.mjs \
            > "$RUNNER_TEMP/verify-gateway-proxy.log" 2>&1 &
          proxy_pid=$!
          unset GATEWAY_TOKEN placeholder_token
          echo "$proxy_pid" > "$RUNNER_TEMP/verify-gateway-proxy.pid"
          for _ in $(seq 1 30); do
            if ! kill -0 "$proxy_pid" 2>/dev/null; then
              break
            fi
            if curl --noproxy '*' -fsS http://127.0.0.1:8080/healthz > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/verify-gateway-proxy.log"
          echo '::error::Gateway proxy did not become ready.'
          exit 1
      # The proxy holds the telemetry token and forwards only OTLP requests. Set the variable
      # to the <catalog>.<schema>.<table_prefix> of a UC-linked experiment to enable export.
      - id: telemetry
        name: Mint telemetry token
        if: vars.VERIFY_MLFLOW_TRACE_LOCATION != ''
        uses: ./trusted/.github/actions/mint-telemetry-token
        with:
          host: ${{ secrets.DATABRICKS_HOST }}
          client-id: ${{ secrets.DATABRICKS_CLIENT_ID }}
          client-secret: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
      - name: Start telemetry proxy
        id: telemetry-proxy
        if: steps.telemetry.outcome == 'success'
        env:
          TELEMETRY_TOKEN: ${{ steps.telemetry.outputs.token }}
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          TRACE_LOCATION: ${{ vars.VERIFY_MLFLOW_TRACE_LOCATION }}
        run: |
          placeholder_token=$(openssl rand -hex 32)
          echo "::add-mask::$placeholder_token"
          printf 'placeholder-token=%s\n' "$placeholder_token" >> "$GITHUB_OUTPUT"
          printf '%s\n%s\n' "$TELEMETRY_TOKEN" "$placeholder_token" | env -u TELEMETRY_TOKEN \
            DATABRICKS_HOST="$DATABRICKS_HOST" TRACE_LOCATION="$TRACE_LOCATION" \
            node trusted/.claude/sandbox/otel-proxy.mjs \
            > "$RUNNER_TEMP/verify-telemetry-proxy.log" 2>&1 &
          proxy_pid=$!
          unset TELEMETRY_TOKEN placeholder_token
          echo "$proxy_pid" > "$RUNNER_TEMP/verify-telemetry-proxy.pid"
          for _ in $(seq 1 30); do
            if ! kill -0 "$proxy_pid" 2>/dev/null; then
              break
            fi
            if curl --noproxy '*' -fsS http://127.0.0.1:8081/healthz > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/verify-telemetry-proxy.log"
          echo '::error::Telemetry proxy did not become ready.'
          exit 1
      - id: session
        name: Generate session ID
        run: |
          echo "id=$(cat /proc/sys/kernel/random/uuid)" >> "$GITHUB_OUTPUT"
      - name: Verify PR behavior
        working-directory: trusted
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ANTHROPIC_BASE_URL: http://localhost:8080/anthropic
          ANTHROPIC_AUTH_TOKEN: ${{ steps.gateway-proxy.outputs.placeholder-token }}
          ANTHROPIC_CUSTOM_HEADERS: ${{ steps.gateway.outputs.custom-headers }}
          ANTHROPIC_DEFAULT_SONNET_MODEL: databricks-claude-sonnet-5
          MODEL: ${{ inputs.model || 'databricks-claude-opus-5-5' }}
          EFFORT: ${{ inputs.effort || 'medium' }}
          SESSION_ID: ${{ steps.session.outputs.id }}
          CLAUDE_CODE_ENABLE_TELEMETRY: ${{ steps.telemetry.outcome == 'success' && '1' || '0' }}
          CLAUDE_CODE_ENHANCED_TELEMETRY_BETA: ${{ steps.telemetry.outcome == 'success' && '1' || '0' }}
          OTEL_TRACES_EXPORTER: ${{ steps.telemetry.outcome == 'success' && 'otlp' || 'none' }}
          OTEL_LOGS_EXPORTER: ${{ steps.telemetry.outcome == 'success' && 'otlp' || 'none' }}
          OTEL_METRICS_EXPORTER: ${{ steps.telemetry.outcome == 'success' && 'otlp' || 'none' }}
          OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
          OTEL_EXPORTER_OTLP_HEADERS: ${{ steps.telemetry.outcome == 'success' && format('Authorization={0} {1}', 'Bearer', steps.telemetry-proxy.outputs.placeholder-token) || '' }}
          OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://localhost:8081/v1/traces
          OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: http://localhost:8081/v1/logs
          OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: http://localhost:8081/v1/metrics
          OTEL_LOG_USER_PROMPTS: "1"
          OTEL_LOG_ASSISTANT_RESPONSES: "1"
          OTEL_LOG_TOOL_DETAILS: "1"
          OTEL_LOG_TOOL_CONTENT: "1"
          OTEL_RESOURCE_ATTRIBUTES: github.pr_number=${{ github.event.issue.number || inputs.pr_number }},github.pr_url=${{ github.server_url }}/${{ github.repository }}/pull/${{ github.event.issue.number || inputs.pr_number }},github.run_url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          AGENT_BROWSER_ARGS: --no-sandbox
          AGENT_BROWSER_SCREENSHOT_DIR: ${{ env.VERIFY_TMP_DIR }}/out/media
        run: |
          mkdir -p "$VERIFY_TMP_DIR/out/media" "$VERIFY_TMP_DIR/work"
          if [ "$CLAUDE_CODE_ENABLE_TELEMETRY" = 1 ]; then
            echo "MLflow telemetry session: \`$SESSION_ID\`" >> "$GITHUB_STEP_SUMMARY"
          fi
          token=$(cat /proc/sys/kernel/random/uuid)
          echo "::stop-commands::$token"
          timeout --kill-after=10s 60m setsid bash -o pipefail -c '
            echo "$$" > "$RUNNER_TEMP/verify-agent.pgid"
            printf -v skill_inputs "\"%s\" \"%s\" \"%s\"" \
              "$GITHUB_WORKSPACE/trusted" \
              "$GITHUB_WORKSPACE/pr" \
              "$VERIFY_TMP_DIR"
            claude \
              --model "$MODEL" \
              --effort "$EFFORT" \
              --session-id "$SESSION_ID" \
              --max-budget-usd 5 \
              --permission-mode auto \
              --disallowed-tools "WebSearch,WebFetch" \
              --print \
              --verbose \
              --output-format stream-json \
              "/verify $skill_inputs" | "$GITHUB_WORKSPACE/trusted/.claude/scripts/stream.sh"
          ' || { echo "::$token::"; exit 1; }
          echo "::$token::"
      - name: Stop agent processes
        if: always()
        run: |
          if [ -s "$RUNNER_TEMP/verify-agent.pgid" ]; then
            pgid=$(cat "$RUNNER_TEMP/verify-agent.pgid")
            if [[ "$pgid" =~ ^[1-9][0-9]*$ ]]; then
              kill -KILL -- "-$pgid" 2>/dev/null || true
            fi
          fi
      - name: Reset trusted checkout
        if: always() && steps.trusted.outcome == 'success'
        working-directory: trusted
        run: |
          git reset --hard "$GITHUB_SHA"
          git clean -fd
          status=$(git status --porcelain --untracked-files=all)
          if [ -n "$status" ]; then
            printf '%s\n' "$status"
            exit 1
          fi
      - name: Validate review
        run: |
          uv run --no-project python "$GITHUB_WORKSPACE/trusted/.claude/skills/verify/scripts/cli.py" validate \
            --payload "$VERIFY_TMP_DIR/out/payload.json" --media-dir "$VERIFY_TMP_DIR/out/media" \
            --diff "$VERIFY_TMP_DIR/in/pr.diff"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verify-out-${{ github.run_id }}
          path: ${{ env.VERIFY_TMP_DIR }}/out/
          overwrite: true
          if-no-files-found: error
          retention-days: 1
      - name: Stop proxies
        if: always()
        run: |
          for proxy in gateway telemetry; do
            if [ -s "$RUNNER_TEMP/verify-$proxy-proxy.log" ]; then
              cat "$RUNNER_TEMP/verify-$proxy-proxy.log"
            fi
            if [ -f "$RUNNER_TEMP/verify-$proxy-proxy.pid" ]; then
              kill "$(cat "$RUNNER_TEMP/verify-$proxy-proxy.pid")" 2>/dev/null || true
            fi
          done

  publish:
    needs: [gate, verify]
    if: always() && needs.gate.result == 'success' && needs.gate.outputs.allowed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    # Keep absolute media references from the verification payload valid on this runner.
    env:
      VERIFY_TMP_DIR: /tmp/verify
    steps:
      - name: Checkout trusted workflow files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-python
        if: needs.verify.result == 'success'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.verify.result == 'success'
        with:
          name: verify-out-${{ github.run_id }}
          path: ${{ env.VERIFY_TMP_DIR }}/out
      - name: Validate review
        id: validate
        if: needs.verify.result == 'success'
        run: |
          uv run --no-project python .claude/skills/verify/scripts/cli.py validate \
            --payload "$VERIFY_TMP_DIR/out/payload.json" --media-dir "$VERIFY_TMP_DIR/out/media"
      - name: Embed review media
        id: embed
        if: needs.verify.result == 'success' && (github.event_name != 'workflow_dispatch' || !inputs.dry_run)
        env:
          GH_TOKEN: ${{ secrets.UPLOAD_MEDIA_TOKEN }}
          REPOSITORY_ID: ${{ github.repository_id }}
        run: |
          uv run --no-project python .claude/skills/verify/scripts/cli.py embed \
            --payload "$VERIFY_TMP_DIR/out/payload.json" --media-dir "$VERIFY_TMP_DIR/out/media"
      # The review app posts the review and enables auto-merge; a preview only reads the PR.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        if: always() && (github.event_name != 'workflow_dispatch' || !inputs.dry_run)
        with:
          client-id: ${{ secrets.REVIEW_CLIENT_ID }}
          private-key: ${{ secrets.REVIEW_PRIVATE_KEY }}
          owner: mlflow
          repositories: mlflow
          # Enabling auto-merge needs write access to contents.
          permission-contents: write
          permission-pull-requests: write
      # Runs even when verification failed, so it relies on the runner's Python rather than uv.
      - name: Publish or preview review
        if: always()
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number || inputs.pr_number }}
          HEAD_SHA: ${{ needs.gate.outputs.head }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          REVIEW_READY: ${{ needs.verify.result == 'success' && steps.validate.outcome == 'success' && (github.event_name == 'workflow_dispatch' && inputs.dry_run || steps.embed.outcome == 'success') }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
        run: |
          args=(--repo "$REPO" --pr-number "$PR_NUMBER" --head-sha "$HEAD_SHA" --run-url "$RUN_URL")
          if [ "$REVIEW_READY" = true ]; then
            args+=(--payload "$VERIFY_TMP_DIR/out/payload.json")
          fi
          if [ "$DRY_RUN" != true ]; then
            args+=(--no-dry-run)
          fi
          python3 .claude/skills/verify/scripts/cli.py publish "${args[@]}"
