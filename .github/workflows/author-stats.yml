name: Author stats

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to update"
        required: true
        type: number

concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

permissions: {}
cache-mode: none

jobs:
  set-fields:
    if: >-
      github.repository == 'mlflow/mlflow' &&
      (github.event_name != 'issues' ||
        (github.event.issue.user.type == 'User' &&
          !contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)))
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Set author stats fields
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
          AUTHOR: ${{ github.event.issue.user.login }}
          # Org issue field IDs (`gh api orgs/mlflow/issue-fields`).
          REPOS_FIELD_ID: 49034796 # Author PR repos (30d)
          PRS_FIELD_ID: 49036049 # Author PRs (30d)
        run: |
          author="$AUTHOR"
          if [ -z "$author" ]; then
            read -r author author_type < <(gh api "repos/$REPO/issues/$ISSUE_NUMBER" --jq '"\(.user.login) \(.user.type)"')
            if [ "$author_type" != User ]; then
              echo "Skipping $author ($author_type)"
              exit 0
            fi
          fi
          # Counts only repos the token can see, so effectively public repos plus this one.
          read -r repos prs < <(
            gh api graphql \
              -f login="$author" \
              -f from="$(date -u -d '30 days ago' +%Y-%m-%dT%H:%M:%SZ)" \
              -f to="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              -f query='
                query($login: String!, $from: DateTime!, $to: DateTime!) {
                  user(login: $login) {
                    contributionsCollection(from: $from, to: $to) {
                      pullRequestContributionsByRepository(maxRepositories: 100) {
                        contributions { totalCount }
                      }
                    }
                  }
                }' \
              --jq '.data.user.contributionsCollection.pullRequestContributionsByRepository
                | "\(length) \(map(.contributions.totalCount) | add // 0)"'
          )
          # POST (not PUT) so other field values on the issue are kept.
          jq -n \
            --argjson repos_id "$REPOS_FIELD_ID" --argjson repos "$repos" \
            --argjson prs_id "$PRS_FIELD_ID" --argjson prs "$prs" \
            '{issue_field_values: [{field_id: $repos_id, value: $repos}, {field_id: $prs_id, value: $prs}]}' \
            | gh api -X POST "repos/$REPO/issues/$ISSUE_NUMBER/issue-field-values" --input - > /dev/null
          echo "Set $author's stats on #$ISSUE_NUMBER: $repos repos, $prs PRs" >> "$GITHUB_STEP_SUMMARY"
