name: Author stats

on:
  issues:
    types: [opened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

permissions: {}
cache-mode: none

jobs:
  set-fields:
    if: >-
      github.repository == 'mlflow/mlflow' &&
      github.event.issue.user.type == 'User' &&
      !contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Set author stats fields
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          AUTHOR: ${{ github.event.issue.user.login }}
          # Org issue field IDs (`gh api orgs/mlflow/issue-fields`).
          REPOS_FIELD_ID: 49034796 # Author PR repos (30d)
          PRS_FIELD_ID: 49036049 # Author PRs (30d)
        run: |
          from=$(date -u -d '30 days ago' +%Y-%m-%dT%H:%M:%SZ)
          to=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          stats=$(
            gh api --method GET search/issues --paginate --slurp \
              -f q="is:pr author:$AUTHOR -user:$AUTHOR created:$from..$to" \
              -f per_page=100 -f sort=created -f order=asc \
              | jq -er '
                if any(.[]; .incomplete_results) then
                  error("GitHub returned incomplete author PR search results")
                elif any(.[]; .total_count > 1000) then
                  error("Author PR search exceeds the 1,000-result limit")
                else
                  [.[].items[]]
                  | "\(map(.repository_url) | unique | length) \(length)"
                end'
          )
          read -r repos prs <<< "$stats"
          # POST (not PUT) so other field values on the issue are kept.
          jq -n \
            --argjson repos_id "$REPOS_FIELD_ID" --argjson repos "$repos" \
            --argjson prs_id "$PRS_FIELD_ID" --argjson prs "$prs" \
            '{issue_field_values: [{field_id: $repos_id, value: $repos}, {field_id: $prs_id, value: $prs}]}' \
            | gh api -X POST "repos/$REPO/issues/$ISSUE_NUMBER/issue-field-values" --input - > /dev/null
