name: review

on:
  issue_comment:
    types: [created]
  pull_request:
    paths:
      - ".github/workflows/review.yml"
      - ".github/actions/setup-gateway/**"
      - ".claude/scripts/**"
      - ".claude/skills/pr-review/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

permissions: {}

jobs:
  # Auth gate: only users with admin or maintain role on the repo can trigger
  # the review (plus the Copilot bot). For issue_comment, BOTH the PR author
  # and the commenter are checked.
  gate:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      head_sha: ${{ steps.head.outputs.head_sha }}
    # Cheap author_association prefilter so random users can't spawn workflow
    # runs. The gate step below does the authoritative admin/maintain role
    # check.
    if: >
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.draft == false &&
       (contains(fromJson('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association) ||
        (github.event.pull_request.user.login == 'Copilot' && github.event.pull_request.user.type == 'Bot')))
      ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       (
        contains(fromJson('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.issue.author_association) ||
        (github.event.issue.user.login == 'Copilot' && github.event.issue.user.type == 'Bot')
       ) &&
       contains(fromJson('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
       startsWith(github.event.comment.body, '/review') &&
       !startsWith(github.event.comment.body, '/review-'))
    steps:
      - name: Check user permission
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login || github.event.issue.user.login }}
          PR_AUTHOR_TYPE: ${{ github.event.pull_request.user.type || github.event.issue.user.type }}
          COMMENTER: ${{ github.event.comment.user.login }}
        run: |
          check_user() {
            local user=$1
            local type=$2
            if [ "$user" = "Copilot" ] && [ "$type" = "Bot" ]; then
              echo "Allowing Copilot bot: $user"
              return 0
            fi
            local role
            role=$(gh api "repos/$REPO/collaborators/$user/permission" --jq .role_name) \
              || { echo "Failed to fetch permission for $user"; exit 1; }
            case "$role" in
              admin|maintain)
                echo "User $user is allowed (admin or maintain role)"
                ;;
              *)
                echo "User $user is not allowed (admin or maintain role required)"
                exit 1
                ;;
            esac
          }
          check_user "$PR_AUTHOR" "$PR_AUTHOR_TYPE"
          if [ "$EVENT_NAME" = "issue_comment" ]; then
            check_user "$COMMENTER" "User"
          fi

      # Pinned here, before anything checks out or runs PR code. `issue_comment`
      # is the only path that has to fetch: its payload describes the comment,
      # not the pull request.
      - name: Resolve reviewed head commit
        id: head
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
          CONTEXT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          head_sha="$CONTEXT_HEAD_SHA"
          if [ -z "$head_sha" ]; then
            head_sha=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq .head.sha)
          fi
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"

  # Links the comment to the review while it runs. Alongside `review` rather
  # than before it: a job has no URL until it exists.
  link:
    needs: gate
    runs-on: ubuntu-slim
    # The poll loop below can spend ~36s of this before the PATCH, and a job
    # timeout cancels the job (reddening the run) even though its steps are
    # `continue-on-error`.
    timeout-minutes: 5
    permissions:
      actions: read
      pull-requests: write
    steps:
      # Runs on both events, so the smoke path covers the polling, the
      # `actions: read` scope, and the job-name filter.
      - name: Wait for the review job URL
        id: job
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          for _ in $(seq 6); do
            url=$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs" --paginate \
                    --jq '.jobs[] | select(.name == "review") | .html_url') || true
            if [ -n "$url" ]; then
              echo "url=$url" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 5
          done
          echo "::warning::review job never became visible; linking the run instead"

      # Falls back to the run URL, so the comment is acknowledged either way.
      # Cosmetic, so it must not take the run down with it.
      - name: Link the comment to the review
        if: github.event_name == 'issue_comment'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          JOB_URL: ${{ steps.job.outputs.url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMENT_ID: ${{ github.event.comment.id }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          printf '%s\n\n---\n\n🚀 [Review running...](%s?pr=%s)' \
            "$COMMENT_BODY" "${JOB_URL:-$RUN_URL}" "$PR_NUMBER" \
            | gh api "repos/$REPO/issues/comments/$COMMENT_ID" -X PATCH -F body=@-

  review:
    needs: gate
    runs-on: ubuntu-latest
    # Runs PR code by design, so it holds nothing that can write to the PR and
    # no app key to mint one. The sandbox below puts it out of reach of this
    # job's process memory too.
    permissions:
      contents: read
      packages: read # to pull the sandbox image
      pull-requests: read
    # gVisor costs wall clock, so both this and the `timeout` below carry more
    # headroom than the unsandboxed job needed.
    timeout-minutes: 60
    env:
      # Written in the sandbox, read back here, so both sit under one bind mount.
      REVIEW_OUT: /tmp/review-out
      REVIEW_PAYLOAD: /tmp/review-out/review-payload.json
      REVIEW_MEDIA: /tmp/review-out/media
      RESULT_BODY: /tmp/updated-comment.md
      PR_CHECKOUT: ${{ github.workspace }}/pr
      SANDBOX_IMAGE: ghcr.io/mlflow/sandbox:latest
      # A copy, so a sandbox write cannot reach the `base` the runner later
      # runs `skills` from with `UPLOAD_MEDIA_TOKEN` in scope.
      SANDBOX_BASE: /tmp/base-sandbox
    steps:
      - name: Resolve job URL
        env:
          JOB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/job/${{ job.check_run_id }}?pr=${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          echo "JOB_RUN_URL=$JOB_RUN_URL" >> "$GITHUB_ENV"
      # Each checkout owns a subdirectory, so neither cleans the other and the
      # two can run together.
      - parallel:
          # Everything this job runs comes from here: the setup actions, the
          # install scripts, the `.claude` config Claude loads (settings, hooks,
          # skills), and the `skills` CLI. No `ref`, so this is `github.ref` at
          # `github.sha`, the commit the workflow file itself was read from:
          # the default branch on `issue_comment`, and the PR's merge ref on
          # `pull_request`, where the two checkouts are the same tree and
          # changes to this tooling get smoke-tested.
          - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            with:
              persist-credentials: false
              path: base
          # The reviewed tree, passed to the review as a path. Nothing the job
          # itself runs comes from here.
          - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            with:
              persist-credentials: false
              ref: refs/pull/${{ github.event.pull_request.number || github.event.issue.number }}/merge
              path: pr
              # Depth 2 so HEAD^1 (the merge ref's base parent) is reachable, letting
              # the pr-review skill read pre-change content via `git show HEAD^1:<path>`.
              fetch-depth: 2
      # HEAD^2 of the merge ref is the PR head. A mismatch means the branch moved
      # between the gate and this checkout, so the run would review a different
      # commit than the one it was started for.
      - name: Verify reviewed head commit
        env:
          EXPECTED_HEAD_SHA: ${{ needs.gate.outputs.head_sha }}
        run: |
          PR_HEAD_SHA=$(git -C "$PR_CHECKOUT" rev-parse HEAD^2)
          if [ "$PR_HEAD_SHA" != "$EXPECTED_HEAD_SHA" ]; then
            echo "::error::PR head moved after the gate pinned $EXPECTED_HEAD_SHA (merge ref now has $PR_HEAD_SHA)"
            exit 1
          fi
      # The package is private, so pulling it needs a login even from this repo.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - parallel:
          # For the payload steps below; the review's toolchain is in the image.
          - uses: ./base/.github/actions/setup-python
            with:
              pin-micro-version: false
          # For the result body script at the end of the job.
          - uses: ./base/.github/actions/setup-node
          # A userspace kernel: the host kernel never sees the sandbox's syscalls.
          # `runsc install` only edits the daemon config, so it runs alongside the
          # pull below; the restart that applies it has to wait until that is done.
          - name: Install gVisor
            run: |
              curl -fsSL https://gvisor.dev/archive.key \
                | sudo gpg --dearmor -o /usr/share/keyrings/gvisor-archive-keyring.gpg
              echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/gvisor-archive-keyring.gpg] https://storage.googleapis.com/gvisor/releases release main" \
                | sudo tee /etc/apt/sources.list.d/gvisor.list
              sudo apt-get update
              sudo apt-get install -y runsc
              sudo runsc install
          - name: Pull the sandbox image
            run: |
              docker pull "$SANDBOX_IMAGE"

      - name: Stage the sandbox
        run: |
          # Picks up the runtime `runsc install` registered. Restarting mid-pull
          # would have failed it, hence the split.
          sudo systemctl restart docker
          docker run --rm --runtime=runsc "$SANDBOX_IMAGE" true
          cp -a base "$SANDBOX_BASE"
          mkdir -p "$REVIEW_MEDIA"

      - name: Parse review arguments
        id: prompt
        env:
          COMMENT_BODY: ${{ github.event_name == 'issue_comment' && github.event.comment.body || '' }}
          LABELS_JSON: ${{ toJson(github.event.pull_request.labels || github.event.issue.labels) }}
        run: |
          cat > /tmp/parse_args.py <<'EOF'
          import argparse
          import json
          import os
          import sys

          MODEL_ALIASES = {
              "opus": "claude-opus-5",
              "sonnet": "claude-sonnet-5",
          }
          MODEL_CHOICES = [*MODEL_ALIASES, *MODEL_ALIASES.values()]
          EFFORT_CHOICES = ["low", "medium", "high", "xhigh", "max"]

          labels = {l["name"] for l in json.loads(os.environ["LABELS_JSON"])}
          big = bool(labels & {"size/M", "size/L", "size/XL"})
          default_model = "claude-opus-5" if big else "claude-sonnet-5"

          body = sys.stdin.read().removeprefix("/review")

          parser = argparse.ArgumentParser(add_help=False)
          parser.add_argument("-m", "--model", choices=MODEL_CHOICES, default=default_model)
          parser.add_argument("-e", "--effort", choices=EFFORT_CHOICES, default="high")
          args = parser.parse_args(body.split())
          model = MODEL_ALIASES.get(args.model, args.model)

          # The gateway names each Foundation Model API endpoint `databricks-<model>`.
          sys.stdout.write(f"model=databricks-{model}\neffort={args.effort}\n")
          EOF

          echo "$COMMENT_BODY" | python /tmp/parse_args.py >> "$GITHUB_OUTPUT"

      - id: gateway
        uses: ./base/.github/actions/setup-gateway
        with:
          task: pr-review
          host: ${{ secrets.DATABRICKS_GATEWAY_HOST }}
          client-id: ${{ secrets.DATABRICKS_GATEWAY_CLIENT_ID }}
          client-secret: ${{ secrets.DATABRICKS_GATEWAY_CLIENT_SECRET }}

      # nginx holds the bearer and overwrites the placeholder header the sandbox
      # sends, so the credential never enters the container. No TLS interception:
      # `ANTHROPIC_BASE_URL` is our own endpoint.
      - name: Start the gateway proxy
        env:
          GATEWAY_URL: ${{ steps.gateway.outputs.base-url }}
          GATEWAY_TOKEN: ${{ steps.gateway.outputs.token }}
        run: |
          umask 077
          cat > /tmp/nginx.conf <<CONF
          events {}
          http {
            access_log /dev/stdout;
            # Each turn resends the whole conversation, and a screenshot the
            # review reads is a multi-MB base64 image. The 1m default 413s them.
            client_max_body_size 0;
            server {
              listen 80;
              # Answered by nginx itself, so the probe below cannot be held up by
              # the gateway.
              location = /healthz {
                access_log off;
                return 200;
              }
              location / {
                proxy_pass ${GATEWAY_URL}/;
                proxy_set_header Authorization "Bearer ${GATEWAY_TOKEN}";
                proxy_http_version 1.1;
                # Streamed responses, and the default 60s read timeout is short
                # for a review turn.
                proxy_buffering off;
                proxy_request_buffering off;
                proxy_read_timeout 600s;
                # This hop is what attaches the credential, so it verifies the
                # gateway rather than trusting whatever answers.
                proxy_ssl_server_name on;
                proxy_ssl_verify on;
                proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
              }
            }
          }
          CONF
          # The sandbox runs as uid 1001 to keep its bind mounts writable, which
          # is the runner's own uid, so mode alone would not keep the bearer from
          # it if anything under /tmp were ever mounted in.
          sudo chown root:root /tmp/nginx.conf
          docker run --detach --name gw-proxy --publish 8080:80 \
            --volume /tmp/nginx.conf:/etc/nginx/nginx.conf:ro \
            nginx:1.29-alpine@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de
          # `--max-time` per attempt: without it a stalled connection would burn
          # the whole `timeout` inside the first curl and never retry.
          timeout 60 bash -c 'until curl -sf -o /dev/null --max-time 5 http://127.0.0.1:8080/healthz; do sleep 1; done'

      # The sandbox gets the PR tree, the tooling copy and a read-only `GH_TOKEN`,
      # each mounted at the path it has on the runner so a cited screenshot still
      # resolves for `skills embed-media` afterwards.
      - name: Review
        id: review
        env:
          # Read-only for the whole job: injected instructions can't mutate the PR.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_BASE_URL: http://gw-proxy:8080
          # The CLI refuses to start without a credential, so not simply empty.
          ANTHROPIC_AUTH_TOKEN: placeholder-not-a-real-credential
          # Tags, not a credential.
          ANTHROPIC_CUSTOM_HEADERS: ${{ steps.gateway.outputs.custom-headers }}
          # The auto mode permission classifier picks its model from the sonnet
          # and opus aliases rather than `--model`, so without these it requests
          # a bare `claude-sonnet-5` that the gateway does not serve and every
          # ambiguous Bash command gets denied.
          ANTHROPIC_DEFAULT_SONNET_MODEL: databricks-claude-sonnet-5
          ANTHROPIC_DEFAULT_OPUS_MODEL: databricks-claude-opus-5
          # The gateway's beta allowlist rejects several of the CLI's
          # experimental betas with HTTP 400.
          CLAUDE_CODE_DISABLE_EXPERIMENTAL_BETAS: "1"
          PR_URL: ${{ github.event.pull_request.html_url || github.event.issue.html_url }}
          MODEL: ${{ steps.prompt.outputs.model }}
          EFFORT: ${{ steps.prompt.outputs.effort }}
          AGENT_BROWSER_SCREENSHOT_DIR: ${{ env.REVIEW_MEDIA }}
        run: |
          OUTPUT_FILE="/tmp/output.jsonl"

          # Both event paths run /pr-review end-to-end against the PR; on
          # pull_request (smoke), the steps that mutate the PR are gated off so
          # no review is submitted.
          EXIT_CODE=0
          # The gateway does not serve Anthropic's server-side web_search tool.
          # Denying the bare name drops it from Claude's context instead of
          # leaving it to fail on use.
          timeout 45m docker run --rm --runtime=runsc \
            --add-host gw-proxy:host-gateway \
            --volume "$SANDBOX_BASE:$SANDBOX_BASE" \
            --volume "$PR_CHECKOUT:$PR_CHECKOUT" \
            --volume "$REVIEW_OUT:$REVIEW_OUT" \
            --workdir "$SANDBOX_BASE" \
            --env GH_TOKEN \
            --env ANTHROPIC_BASE_URL \
            --env ANTHROPIC_AUTH_TOKEN \
            --env ANTHROPIC_CUSTOM_HEADERS \
            --env ANTHROPIC_DEFAULT_SONNET_MODEL \
            --env ANTHROPIC_DEFAULT_OPUS_MODEL \
            --env CLAUDE_CODE_DISABLE_EXPERIMENTAL_BETAS \
            --env AGENT_BROWSER_SCREENSHOT_DIR \
            "$SANDBOX_IMAGE" \
            claude \
              --model "$MODEL" \
              --effort "$EFFORT" \
              --max-budget-usd 8 \
              --permission-mode auto \
              --add-dir "$PR_CHECKOUT" \
              --allowed-tools "Bash(uv run --directory $SANDBOX_BASE --package skills skills:*)" \
              --disallowed-tools WebSearch \
              --print \
              --verbose \
              --output-format stream-json \
              "/pr-review $PR_URL $PR_CHECKOUT $REVIEW_PAYLOAD $REVIEW_MEDIA $SANDBOX_BASE" \
            | base/.claude/scripts/stream.sh "$OUTPUT_FILE" || EXIT_CODE=$?
          if [ "${EXIT_CODE:-0}" -eq 124 ]; then
            echo "Warning: Claude command timed out after 45 minutes"
          elif [ "${EXIT_CODE:-0}" -ne 0 ]; then
            echo "Error: Claude command failed with exit code $EXIT_CODE"
            cat "$OUTPUT_FILE"
            exit $EXIT_CODE
          fi

      # A sandbox that cannot reach the proxy only reports a request timeout.
      - name: Gateway proxy log
        if: always()
        continue-on-error: true
        run: |
          docker logs gw-proxy

      # Kept out of the Claude step so a poisoned diff can't reach this PAT.
      # Metadata-only, unlike the app key, so it stays where the files and the
      # `skills` CLI are.
      - name: Upload review media
        if: github.event_name == 'issue_comment'
        working-directory: base
        # Attaching media is a nicety; losing the whole review over it is not.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.UPLOAD_MEDIA_TOKEN }}
          REPO_ID: ${{ github.event.repository.id }}
        run: |
          uv run --package skills skills embed-media \
            --dir "$REVIEW_MEDIA" \
            --target "$REVIEW_PAYLOAD" \
            --repository-id "$REPO_ID"

      # Without commit_id, GitHub anchors the comments to whatever head is current
      # at POST time. The SHA comes from the gate. Injected before validation so
      # the schema's SHA pattern covers it.
      - name: Pin review to the reviewed commit
        env:
          PR_HEAD_SHA: ${{ needs.gate.outputs.head_sha }}
        run: |
          if [ ! -f "$REVIEW_PAYLOAD" ]; then
            echo "::error::Claude did not produce $REVIEW_PAYLOAD"
            exit 1
          fi
          jq --arg sha "$PR_HEAD_SHA" '.commit_id = $sha' "$REVIEW_PAYLOAD" > /tmp/pinned-payload.json
          mv /tmp/pinned-payload.json "$REVIEW_PAYLOAD"

      # The only validation there is: `post` runs no repository code.
      - name: Validate review payload
        working-directory: base
        run: |
          uv run --package skills skills validate-review "$REVIEW_PAYLOAD"
          echo "::group::Review payload"
          jq . "$REVIEW_PAYLOAD"
          echo "::endgroup::"

      - name: Redact secrets from transcript
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GATEWAY_TOKEN: ${{ steps.gateway.outputs.token }}
        run: |
          python <<'PY'
          import os
          import sys
          from pathlib import Path

          path = Path("/tmp/output.jsonl")
          if not path.exists():
              sys.exit(0)
          data = path.read_text()
          for name in ("GH_TOKEN", "GATEWAY_TOKEN"):
              if val := os.environ.get(name):
                  data = data.replace(val, "***")
          path.write_text(data)
          PY

      - name: Upload Claude stream transcript
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: claude-stream-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/output.jsonl
          retention-days: 1
          if-no-files-found: ignore

      - name: Build result body
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          MODEL: ${{ steps.prompt.outputs.model }}
          COMMENT_BODY: ${{ github.event_name == 'issue_comment' && github.event.comment.body || '/review' }}
        run: |
          node <<'JS'
          const fs = require('fs');
          const jobStatus = process.env.JOB_STATUS;
          const model = process.env.MODEL;
          const jobRunUrl = process.env.JOB_RUN_URL;

          const outputPath = '/tmp/output.jsonl';
          let claudeOutput = '';
          try {
            if (fs.existsSync(outputPath)) {
              claudeOutput = fs.readFileSync(outputPath, 'utf8');
            }
          } catch (e) {
            console.log('Failed to read Claude output file:', e);
          }

          let resultEvent = null;
          if (claudeOutput) {
            try {
              const events = claudeOutput.trim().split('\n').filter(Boolean).map(JSON.parse);
              resultEvent = events.findLast(({ type }) => type === 'result');
            } catch (e) {
              console.log('Failed to parse Claude output as JSON:', e);
            }
          }

          const failed = jobStatus !== 'success' || resultEvent?.is_error;
          const icon = failed ? '❌' : '✅';
          const verb = failed ? 'failed' : 'completed';
          let resultLine = `${icon} [Review](${jobRunUrl}) ${verb}`;

          if (resultEvent) {
            const seconds = (resultEvent.duration_ms / 1000).toFixed(1);
            const tokens = (resultEvent.usage?.input_tokens ?? 0) + (resultEvent.usage?.output_tokens ?? 0);
            const cost = (Math.round(resultEvent.total_cost_usd * 100) / 100).toFixed(2);
            resultLine += ` (${model}, ${seconds}s, ${resultEvent.num_turns} turns, ${tokens} tokens, $${cost})`;
            const summary = resultEvent.is_error ? 'Error' : 'Result';
            const formatted = JSON.stringify(resultEvent, null, 2);
            resultLine += `\n<details><summary>${summary}</summary>\n\n\`\`\`json\n${formatted}\n\`\`\`\n\n</details>`;
            if (resultEvent.is_error && /529|Overloaded/i.test(resultEvent.result || '')) {
              resultLine += `\n\nThe Claude API is overloaded. Check [status.claude.com](https://status.claude.com/) and retry.`;
            }
          } else if (failed) {
            resultLine += `\n\nSee [workflow logs](${jobRunUrl}) for details.`;
          }

          console.log(resultLine);
          fs.writeFileSync(process.env.RESULT_BODY, `${process.env.COMMENT_BODY}\n\n---\n\n${resultLine}`);
          JS

      # Keyed on run_id, not run_attempt, so re-running only `post` still finds
      # what the successful `review` attempt left behind. Absolute paths share
      # /tmp, so this unpacks back to the same paths.
      - name: Upload review output
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: review-output-${{ github.run_id }}
          overwrite: true
          path: |
            ${{ env.REVIEW_PAYLOAD }}
            ${{ env.RESULT_BODY }}
          retention-days: 1
          if-no-files-found: ignore

  # A step is not an isolation boundary (passwordless sudo, secrets held for the
  # job's lifetime, processes outliving the step that spawned them); a job is,
  # since each gets its own VM. So the write credential lives here, apart from
  # the code `review` executes. Posts what `review` pinned and validated, with
  # no checkout and no toolchain in between. Runs on both events so the smoke
  # path covers the handoff; the mutating steps are issue_comment-only.
  post:
    # `link` too: both patch the same comment, and a `review` that fails while
    # `link` is still polling would otherwise let this job's result be
    # overwritten by "Review running...". The `if` below ignores its result, so
    # a failed link still reports.
    needs: [gate, link, review]
    if: "!cancelled() && needs.gate.result == 'success'"
    runs-on: ubuntu-slim
    # No GITHUB_TOKEN scopes, so a `gh` call that forgets the app token fails closed.
    permissions: {}
    timeout-minutes: 10
    # Where the artifact unpacks.
    env:
      REVIEW_PAYLOAD: /tmp/review-out/review-payload.json
      RESULT_BODY: /tmp/updated-comment.md
    steps:
      # Not GITHUB_TOKEN: GitHub refuses approving reviews from it, and the
      # payload's `event` can be APPROVE.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        if: github.event_name == 'issue_comment'
        id: app-token
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-pull-requests: write
      # Absent when the review job died before uploading, so the steps below check.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: review-output-${{ github.run_id }}
          path: /tmp

      - name: Post review
        if: needs.review.result == 'success' && github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          if [ ! -f "$REVIEW_PAYLOAD" ]; then
            echo "::error::the review job uploaded no $REVIEW_PAYLOAD"
            exit 1
          fi
          gh api --method POST repos/"$REPO"/pulls/"$PR_NUMBER"/reviews --input "$REVIEW_PAYLOAD"

      - name: Report review results
        if: "!cancelled() && github.event_name == 'issue_comment'"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          COMMENT_ID: ${{ github.event.comment.id }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          POST_STATUS: ${{ job.status }}
        run: |
          # `review` rendered this body and knows nothing about the POST, so a
          # failure here must not leave a success message.
          if [ "$POST_STATUS" != "success" ]; then
            printf '%s\n\n---\n\n❌ [Review](%s) ran but could not be posted.' \
              "$COMMENT_BODY" "$RUN_URL" > "$RESULT_BODY"
          elif [ ! -f "$RESULT_BODY" ]; then
            printf '%s\n\n---\n\n❌ [Review](%s) failed before it could report a result.' \
              "$COMMENT_BODY" "$RUN_URL" > "$RESULT_BODY"
          fi
          gh api "repos/$REPO/issues/comments/$COMMENT_ID" -X PATCH -F body=@"$RESULT_BODY"
