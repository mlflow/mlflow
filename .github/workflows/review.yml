name: review

on:
  issue_comment:
    types: [created]
  pull_request:
    paths:
      - ".github/workflows/review.yml"
      - ".claude/scripts/**"
      - ".claude/skills/pr-review/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

permissions: {}

jobs:
  # Auth gate: only users with admin or maintain role on the repo can trigger
  # the review (plus the Copilot bot). For issue_comment, BOTH the PR author
  # and the commenter are checked.
  gate:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      head-sha: ${{ steps.head-sha.outputs.sha }}
    # Cheap author_association prefilter so random users can't spawn workflow
    # runs. The gate step below does the authoritative admin/maintain role
    # check.
    if: >
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.draft == false &&
       (contains(fromJson('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association) ||
        (github.event.pull_request.user.login == 'Copilot' && github.event.pull_request.user.type == 'Bot')))
      ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       (
        contains(fromJson('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.issue.author_association) ||
        (github.event.issue.user.login == 'Copilot' && github.event.issue.user.type == 'Bot')
       ) &&
       contains(fromJson('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
       startsWith(github.event.comment.body, '/review') &&
       !startsWith(github.event.comment.body, '/review-'))
    steps:
      - name: Check user permission
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login || github.event.issue.user.login }}
          PR_AUTHOR_TYPE: ${{ github.event.pull_request.user.type || github.event.issue.user.type }}
          COMMENTER: ${{ github.event.comment.user.login }}
        run: |
          check_user() {
            local user=$1
            local type=$2
            if [ "$user" = "Copilot" ] && [ "$type" = "Bot" ]; then
              echo "Allowing Copilot bot: $user"
              return 0
            fi
            local role
            role=$(gh api "repos/$REPO/collaborators/$user/permission" --jq .role_name) \
              || { echo "Failed to fetch permission for $user"; exit 1; }
            case "$role" in
              admin|maintain)
                echo "User $user is allowed (admin or maintain role)"
                ;;
              *)
                echo "User $user is not allowed (admin or maintain role required)"
                exit 1
                ;;
            esac
          }
          check_user "$PR_AUTHOR" "$PR_AUTHOR_TYPE"
          if [ "$EVENT_NAME" = "issue_comment" ]; then
            check_user "$COMMENTER" "User"
          fi

      # Pin the commit the trigger asked about. The PR can be pushed to between
      # the trigger and the checkout below, so resolve the head here and verify
      # it after checkout: the run then reviews exactly what was requested, or
      # fails loudly, instead of silently reviewing something newer.
      - name: Resolve head SHA
        id: head-sha
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          # Present on pull_request, empty on issue_comment. Prefer it: it is the
          # head that triggered this run, where the API could already be newer.
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          SHA=$EVENT_HEAD_SHA
          if [ -z "$SHA" ]; then
            SHA=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq .head.sha) \
              || { echo "::error::Failed to resolve head SHA for PR #$PR_NUMBER"; exit 1; }
          fi
          echo "Reviewing $SHA"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

  review:
    needs: gate
    runs-on: ubuntu-latest
    # GITHUB_TOKEN is unused — all GitHub API calls go through the app tokens
    # minted below. Grant nothing so any future accidental use of GITHUB_TOKEN
    # fails closed.
    permissions: {}
    timeout-minutes: 45
    env:
      REVIEW_PAYLOAD: /tmp/review-payload.json
      REVIEW_MEDIA: /tmp/review-media
      HEAD_SHA: ${{ needs.gate.outputs.head-sha }}
    steps:
      # Two app tokens with split scopes:
      # - app-token-read (read-only): used by the Claude step so prompt-injection
      #   in a diff can't trigger comments, approvals, or any PR mutation.
      # - app-token-write (write): used by React/Post/Report (code we control).
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token-read
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: read
          permission-pull-requests: read
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        if: github.event_name == 'issue_comment'
        id: app-token-write
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-pull-requests: write
      - name: Resolve job URL
        env:
          JOB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/job/${{ job.check_run_id }}?pr=${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          echo "JOB_RUN_URL=$JOB_RUN_URL" >> "$GITHUB_ENV"
      - name: React to comment
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ steps.app-token-write.outputs.token }}
          REPO: ${{ github.repository }}
          COMMENT_ID: ${{ github.event.comment.id }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          printf '%s\n\n---\n\n🚀 [Review running...](%s)' "$COMMENT_BODY" "$JOB_RUN_URL" \
            | gh api "repos/$REPO/issues/comments/$COMMENT_ID" -X PATCH -F body=@-
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          token: ${{ steps.app-token-read.outputs.token }}
          ref: refs/pull/${{ github.event.pull_request.number || github.event.issue.number }}/merge
          # Depth 2 so HEAD^1 (the merge ref's base parent) is reachable, letting
          # the pr-review skill read pre-change content via `git show HEAD^1:<path>`.
          fetch-depth: 2
      # The merge ref is recomputed on every push, so it can already point at a
      # newer head. Bail before installing anything or running a line of the
      # checkout rather than review a commit nobody asked about.
      - name: Verify head SHA
        run: |
          ACTUAL=$(git rev-parse HEAD^2)
          if [ "$ACTUAL" != "$HEAD_SHA" ]; then
            echo "::error::PR head moved after the review was requested ($HEAD_SHA -> $ACTUAL). Re-run /review."
            exit 1
          fi
      - parallel:
          - uses: ./.github/actions/setup-python
            with:
              pin-micro-version: false
          - uses: ./.github/actions/setup-node
          - name: Install Claude CLI
            run: |
              .claude/scripts/install-claude.sh
          - name: Install agent-browser
            run: |
              .claude/scripts/install-agent-browser.sh
      - name: Verify tools
        run: |
          claude --version
          agent-browser --version

      - name: Parse review arguments
        id: prompt
        env:
          COMMENT_BODY: ${{ github.event_name == 'issue_comment' && github.event.comment.body || '' }}
          LABELS_JSON: ${{ toJson(github.event.pull_request.labels || github.event.issue.labels) }}
        run: |
          cat > /tmp/parse_args.py <<'EOF'
          import argparse
          import json
          import os
          import sys

          MODEL_ALIASES = {
              "fable": "claude-fable-5",
              "opus": "claude-opus-5",
              "sonnet": "claude-sonnet-5",
          }
          MODEL_CHOICES = [*MODEL_ALIASES, *MODEL_ALIASES.values()]
          EFFORT_CHOICES = ["low", "medium", "high", "xhigh", "max"]

          labels = {l["name"] for l in json.loads(os.environ["LABELS_JSON"])}
          big = bool(labels & {"size/M", "size/L", "size/XL"})
          default_model = "claude-opus-5" if big else "claude-sonnet-5"

          body = sys.stdin.read().removeprefix("/review")

          parser = argparse.ArgumentParser(add_help=False)
          parser.add_argument("-m", "--model", choices=MODEL_CHOICES, default=default_model)
          parser.add_argument("-e", "--effort", choices=EFFORT_CHOICES, default="high")
          args = parser.parse_args(body.split())
          model = MODEL_ALIASES.get(args.model, args.model)

          sys.stdout.write(f"model={model}\neffort={args.effort}\n")
          EOF

          echo "$COMMENT_BODY" | python /tmp/parse_args.py >> "$GITHUB_OUTPUT"

      # The Claude step never sees the real API key: the proxy holds it and the
      # CLI talks to the proxy with a random per-run client key. The real key
      # is passed via stdin (printf is a bash builtin) so it appears in no
      # process's env or argv, and --disable-sigusr1 blocks same-UID processes
      # from recovering it through a signal-triggered inspector session.
      - name: Start Anthropic proxy
        id: proxy
        env:
          ANTHROPIC_API_KEY: ${{ secrets.EXPERIMENTAL_ANTHROPIC_API_KEY }}
        run: |
          CLIENT_KEY=$(openssl rand -hex 32)
          echo "::add-mask::$CLIENT_KEY"
          echo "client-key=$CLIENT_KEY" >> "$GITHUB_OUTPUT"
          printf '%s\n%s' "$ANTHROPIC_API_KEY" "$CLIENT_KEY" \
            | env -u ANTHROPIC_API_KEY node --disable-sigusr1 .claude/scripts/anthropic-proxy.mjs \
              > /tmp/anthropic-proxy.log 2>&1 &
          timeout 10 bash -c 'until curl -sf -o /dev/null http://127.0.0.1:8082/healthz; do sleep 0.5; done' \
            || { echo "::error::Anthropic proxy failed to start"; cat /tmp/anthropic-proxy.log; exit 1; }

      - name: Review
        id: review
        env:
          # Read-only token: Claude can fetch PR/diff/comments but cannot post anything.
          GH_TOKEN: ${{ steps.app-token-read.outputs.token }}
          ANTHROPIC_BASE_URL: http://127.0.0.1:8082
          ANTHROPIC_API_KEY: ${{ steps.proxy.outputs.client-key }}
          PR_URL: ${{ github.event.pull_request.html_url || github.event.issue.html_url }}
          MODEL: ${{ steps.prompt.outputs.model }}
          EFFORT: ${{ steps.prompt.outputs.effort }}
          AGENT_BROWSER_SCREENSHOT_DIR: ${{ env.REVIEW_MEDIA }}
        run: |
          OUTPUT_FILE="/tmp/output.jsonl"
          mkdir -p "$AGENT_BROWSER_SCREENSHOT_DIR"

          # Both event paths run /pr-review end-to-end against the PR; on
          # pull_request (smoke), Post is gated off so no review is submitted.
          EXIT_CODE=0
          timeout 30m claude \
            --model "$MODEL" \
            --effort "$EFFORT" \
            --max-budget-usd 8 \
            --permission-mode auto \
            --allowed-tools "Bash(uv run --package skills skills:*)" \
            --print \
            --verbose \
            --output-format stream-json \
            "/pr-review $PR_URL $REVIEW_PAYLOAD $REVIEW_MEDIA" \
            | .claude/scripts/stream.sh "$OUTPUT_FILE" || EXIT_CODE=$?
          if [ "${EXIT_CODE:-0}" -eq 124 ]; then
            echo "Warning: Claude command timed out after 30 minutes"
          elif [ "${EXIT_CODE:-0}" -ne 0 ]; then
            echo "Error: Claude command failed with exit code $EXIT_CODE"
            cat "$OUTPUT_FILE"
            exit $EXIT_CODE
          fi

      # The runner stops reading the proxy's stdout once its own step ends, so
      # the proxy writes to a file and we dump it here for diagnosability.
      - name: Show proxy log
        if: always()
        run: cat /tmp/anthropic-proxy.log || true

      # Kept out of the Claude step, which holds only the read-only app token, so a
      # poisoned diff can't reach this PAT. Gated like Post so the pull_request
      # smoke path stays non-mutating.
      - name: Upload review media
        if: github.event_name == 'issue_comment'
        # Attaching media is a nicety; losing the whole review over it is not. Any
        # fault here must not take the job down before Post review.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.UPLOAD_MEDIA_TOKEN }}
          REPO_ID: ${{ github.event.repository.id }}
        run: |
          uv run --package skills skills embed-media \
            --dir "$REVIEW_MEDIA" \
            --target "$REVIEW_PAYLOAD" \
            --repository-id "$REPO_ID"

      - name: Validate review payload
        run: |
          if [ ! -f "$REVIEW_PAYLOAD" ]; then
            echo "::error::Claude did not produce $REVIEW_PAYLOAD"
            exit 1
          fi
          # Anchor the review to the commit that was reviewed. Without commit_id,
          # GitHub attaches the comments to whatever the head is at POST time, so
          # a push mid-run lands them on lines the review never saw.
          jq --arg sha "$HEAD_SHA" '.commit_id = $sha' "$REVIEW_PAYLOAD" > "$REVIEW_PAYLOAD.tmp"
          mv "$REVIEW_PAYLOAD.tmp" "$REVIEW_PAYLOAD"
          uv run --package skills skills validate-review "$REVIEW_PAYLOAD"
          echo "::group::Review payload"
          jq . "$REVIEW_PAYLOAD"
          echo "::endgroup::"

      - name: Post review
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ steps.app-token-write.outputs.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh api --method POST repos/"$REPO"/pulls/"$PR_NUMBER"/reviews --input "$REVIEW_PAYLOAD"

      - name: Redact secrets from transcript
        if: always()
        env:
          GH_TOKEN_READ: ${{ steps.app-token-read.outputs.token }}
          GH_TOKEN_WRITE: ${{ steps.app-token-write.outputs.token }}
          PROXY_CLIENT_KEY: ${{ steps.proxy.outputs.client-key }}
        run: |
          python <<'PY'
          import os
          import sys
          from pathlib import Path

          path = Path("/tmp/output.jsonl")
          if not path.exists():
              sys.exit(0)
          data = path.read_text()
          for name in ("GH_TOKEN_READ", "GH_TOKEN_WRITE", "PROXY_CLIENT_KEY"):
              if val := os.environ.get(name):
                  data = data.replace(val, "***")
          path.write_text(data)
          PY

      - name: Upload Claude stream transcript
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: claude-stream-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/output.jsonl
          retention-days: 1
          if-no-files-found: ignore

      - name: Build result body
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          MODEL: ${{ steps.prompt.outputs.model }}
          COMMENT_BODY: ${{ github.event_name == 'issue_comment' && github.event.comment.body || '/review' }}
        run: |
          node <<'JS'
          const fs = require('fs');
          const jobStatus = process.env.JOB_STATUS;
          const model = process.env.MODEL;
          const jobRunUrl = process.env.JOB_RUN_URL;

          const outputPath = '/tmp/output.jsonl';
          let claudeOutput = '';
          try {
            if (fs.existsSync(outputPath)) {
              claudeOutput = fs.readFileSync(outputPath, 'utf8');
            }
          } catch (e) {
            console.log('Failed to read Claude output file:', e);
          }

          let resultEvent = null;
          if (claudeOutput) {
            try {
              const events = claudeOutput.trim().split('\n').filter(Boolean).map(JSON.parse);
              resultEvent = events.findLast(({ type }) => type === 'result');
            } catch (e) {
              console.log('Failed to parse Claude output as JSON:', e);
            }
          }

          const failed = jobStatus !== 'success' || resultEvent?.is_error;
          const icon = failed ? '❌' : '✅';
          const verb = failed ? 'failed' : 'completed';
          let resultLine = `${icon} [Review](${jobRunUrl}) ${verb}`;

          if (resultEvent) {
            const seconds = (resultEvent.duration_ms / 1000).toFixed(1);
            const tokens = (resultEvent.usage?.input_tokens ?? 0) + (resultEvent.usage?.output_tokens ?? 0);
            const cost = (Math.round(resultEvent.total_cost_usd * 100) / 100).toFixed(2);
            resultLine += ` (${model}, ${seconds}s, ${resultEvent.num_turns} turns, ${tokens} tokens, $${cost})`;
            const summary = resultEvent.is_error ? 'Error' : 'Result';
            const formatted = JSON.stringify(resultEvent, null, 2);
            resultLine += `\n<details><summary>${summary}</summary>\n\n\`\`\`json\n${formatted}\n\`\`\`\n\n</details>`;
            if (resultEvent.is_error && /529|Overloaded/i.test(resultEvent.result || '')) {
              resultLine += `\n\nThe Claude API is overloaded. Check [status.claude.com](https://status.claude.com/) and retry.`;
            }
          } else if (failed) {
            resultLine += `\n\nSee [workflow logs](${jobRunUrl}) for details.`;
          }

          console.log(resultLine);
          fs.writeFileSync('/tmp/updated-comment.md', `${process.env.COMMENT_BODY}\n\n---\n\n${resultLine}`);
          JS

      - name: Report review results
        if: always() && github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ steps.app-token-write.outputs.token }}
          REPO: ${{ github.repository }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          gh api "repos/$REPO/issues/comments/$COMMENT_ID" -X PATCH -F body=@/tmp/updated-comment.md
