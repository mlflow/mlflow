name: Labeling

on:
  issues:
    types:
      - opened
      - edited
  pull_request_target:
    types:
      - opened
      - edited

concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

permissions: {}

jobs:
  labeling:
    runs-on: ubuntu-slim
    permissions:
      pull-requests: write
      issues: write
    timeout-minutes: 5
    steps:
      - name: Fetch script
        run: |
          curl -fsSL --retry 3 --connect-timeout 10 --max-time 30 \
            --write-out 'curl: %{time_total}s\n' \
            "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/.github/workflows/labeling.js" \
            -o labeling.js
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          retries: 3
          script: |
            const script = require('./labeling.js');
            await script({ github, context });
