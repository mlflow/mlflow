name: Close old issues

on:
  pull_request:
    paths:
      - .github/workflows/close-old-issues.yml
      - .github/workflows/close-old-issues.js
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Log the issues and pull requests that would be closed"
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

permissions: {}
cache-mode: none

jobs:
  # Runs the PR's own copy of the script so the preview exercises the proposed
  # changes. This is safe because the token is read-only: pull_request events
  # from forks always receive a read-only GITHUB_TOKEN, this job requests only
  # `contents: read`, and `persist-credentials: false` keeps the checkout
  # unauthenticated. A preview can therefore never close anything, however the
  # script is edited. (Same pattern as stale-branches.yml.)
  preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/workflows/close-old-issues.js
          sparse-checkout-cone-mode: false
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DRY_RUN: "true"
          ISSUE_CLOSE_MESSAGE: |
            Hey, thank you for your contribution to MLflow! We sincerely appreciate the time and thought you put into creating this. However, as part of the process to ensure that issues with recent versions get triaged promptly, we will be closing older issues. We still value your contribution, and we would like to trouble you to reopen this issue if it is still relevant to recent releases of MLflow. Thank you for understanding!
          PR_CLOSE_MESSAGE: |
            Hey, thank you for your contribution to MLflow! We sincerely appreciate the time and thought you put into creating this. However, as part of the process to ensure that issues with recent versions get triaged promptly, we will be closing older pull requests. We still value your contribution, and we would like to trouble you to reopen this pull request if it is still relevant to recent releases of MLflow. Thank you for understanding!
        with:
          retries: 3
          script: |
            const script = require(".github/workflows/close-old-issues.js");
            await script({ context, github });

  close:
    if: >-
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      github.repository == 'mlflow/mlflow'
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/workflows/close-old-issues.js
          sparse-checkout-cone-mode: false
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DRY_RUN: ${{ inputs.dry_run == true }}
          ISSUE_CLOSE_MESSAGE: |
            Hey, thank you for your contribution to MLflow! We sincerely appreciate the time and thought you put into creating this. However, as part of the process to ensure that issues with recent versions get triaged promptly, we will be closing older issues. We still value your contribution, and we would like to trouble you to reopen this issue if it is still relevant to recent releases of MLflow. Thank you for understanding!
          PR_CLOSE_MESSAGE: |
            Hey, thank you for your contribution to MLflow! We sincerely appreciate the time and thought you put into creating this. However, as part of the process to ensure that issues with recent versions get triaged promptly, we will be closing older pull requests. We still value your contribution, and we would like to trouble you to reopen this pull request if it is still relevant to recent releases of MLflow. Thank you for understanding!
        with:
          retries: 3
          script: |
            const script = require(".github/workflows/close-old-issues.js");
            await script({ context, github });
