# This workflow configures the environment used by Copilot cloud agent.
# Find recent agent runs with:
#
# gh api '/repos/mlflow/mlflow/actions/runs?event=dynamic&per_page=100' \
#   --jq '.workflow_runs[]
#     | select(.path == "dynamic/copilot-swe-agent/copilot")
#     | {id, name, created_at, conclusion, html_url}'

name: copilot-setup-steps

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

permissions: {}
cache-mode: none

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    cache-mode: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Probe branch setup selection
        run: echo "COPILOT_BACKGROUND_PROBE_20260913 branch setup selected"
      - name: Probe background execution
        id: copilot_background_probe
        background: true
        run: |
          echo "COPILOT_BACKGROUND_PROBE_20260913 background start $(date -u +%FT%TZ)"
          sleep 12
          echo "COPILOT_BACKGROUND_PROBE_20260913 background end $(date -u +%FT%TZ)"
          touch "$RUNNER_TEMP/copilot-background-probe-20260913.done"
      - name: Probe foreground overlap
        run: |
          echo "COPILOT_BACKGROUND_PROBE_20260913 foreground start $(date -u +%FT%TZ)"
          sleep 2
          if [ -f "$RUNNER_TEMP/copilot-background-probe-20260913.done" ]; then
            echo "COPILOT_BACKGROUND_PROBE_20260913 background already finished"
          else
            echo "COPILOT_BACKGROUND_PROBE_20260913 foreground overlapped background"
          fi
      - name: Wait for background probe
        wait: copilot_background_probe
      - name: Probe wait completion
        run: |
          test -f "$RUNNER_TEMP/copilot-background-probe-20260913.done"
          echo "COPILOT_BACKGROUND_PROBE_20260913 wait completed $(date -u +%FT%TZ)"
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/setup-python
        with:
          pin-micro-version: false
      - uses: ./.github/actions/setup-java
      - name: Restore action pins
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/action-pins.json
          key: action-pins-${{ hashFiles('dev/check_actions.py') }}
      - name: Restore mypy cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .mypy_cache
          key: mypy-ubuntu-latest-${{ hashFiles('uv.lock', 'pyproject.toml') }}
          restore-keys: mypy-ubuntu-latest-
      - name: Restore install-bin tools
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            bin/*
            !bin/install.py
            !bin/README.md
            !bin/.gitignore
          key: install-bin-ubuntu-latest-${{ hashFiles('bin/install.py') }}
          restore-keys: install-bin-ubuntu-latest-
      - name: Restore pre-commit hooks
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-ubuntu-latest-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: pre-commit-ubuntu-latest-
      - name: Install dependencies
        run: |
          uv sync --only-group lint
      - name: pre-commit setup
        run: |
          uv run --only-group lint pre-commit install --install-hooks
          uv run --only-group lint pre-commit run install-bin -a -v
