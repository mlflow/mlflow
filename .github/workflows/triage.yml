# Preview a branch: gh workflow run verify.yml --ref <branch> -F pr_number=<number>
# Add -F dry_run=false to publish the review on the specified PR.
name: Verify PR behavior

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to verify"
        required: true
        type: number
      instructions:
        description: "Optional verification focus"
        required: false
        type: string
      model:
        description: "AI Gateway Claude model"
        required: false
        type: choice
        default: databricks-claude-sonnet-5-5
        options:
          - databricks-claude-opus-5-5
          - databricks-claude-sonnet-5-5
          - databricks-claude-haiku-5-5
      effort:
        description: "Reasoning effort"
        required: false
        type: choice
        default: medium
        options: [low, medium, high, xhigh, max]
      dry_run:
        description: "Preview without posting a review or uploading media"
        required: false
        type: boolean
        default: true

concurrency:
  group: >-
    ${{ format('verify-{0}',
      github.event_name == 'workflow_dispatch' && inputs.pr_number ||
      github.event.issue.pull_request != null && github.event.issue.state == 'open' &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
      startsWith(github.event.comment.body, '/verify') && github.event.issue.number ||
      format('ignored-{0}', github.run_id)) }}
  cancel-in-progress: false
  queue: max

defaults:
  run:
    shell: bash

permissions: {}
cache-mode: none

jobs:
  gate:
    if: >-
      github.repository == 'mlflow/mlflow' && vars.VERIFY_DISABLED != 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.issue.pull_request != null && github.event.issue.state == 'open' &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
        startsWith(github.event.comment.body, '/verify')))
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      allowed: ${{ steps.pr.outputs.allowed }}
      head: ${{ steps.pr.outputs.head }}
      base: ${{ steps.pr.outputs.base }}
      base_ref: ${{ steps.pr.outputs.base_ref }}
    steps:
      - name: Check maintainer and snapshot PR
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number || inputs.pr_number }}
          COMMENTER: ${{ github.event.comment.user.login || github.actor }}
          COMMENT: ${{ github.event_name == 'workflow_dispatch' && format('/verify {0}', inputs.instructions) || github.event.comment.body }}
        run: |
          if ! [[ "$COMMENT" =~ ^/verify($|[[:space:]]) ]]; then
            echo 'Not a /verify command.'
            exit 0
          fi
          role=$(gh api "repos/$REPO/collaborators/$COMMENTER/permission" --jq .role_name)
          if [[ "$role" != admin && "$role" != maintain ]]; then
            echo 'The commenter does not have the admin or maintain role.'
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/verify-context"
          gh api "repos/$REPO/pulls/$PR_NUMBER" > "$RUNNER_TEMP/pr.json"
          jq -e '.state == "open"' "$RUNNER_TEMP/pr.json" > /dev/null
          head=$(jq -er '.head.sha | select(test("^[0-9a-f]{40}$"))' "$RUNNER_TEMP/pr.json")
          base=$(jq -er '.base.sha | select(test("^[0-9a-f]{40}$"))' "$RUNNER_TEMP/pr.json")
          base_ref=$(jq -er '.base.ref | strings | select(test("^[^\\r\\n]+$"))' "$RUNNER_TEMP/pr.json")
          jq --arg instructions "${COMMENT#/verify}" \
            '{number, title, body, html_url, draft, head: .head.sha, base: .base.sha, base_ref: .base.ref, instructions: $instructions}' \
            "$RUNNER_TEMP/pr.json" > "$RUNNER_TEMP/verify-context/pr.json"
          {
            echo "head=$head"
            echo "base=$base"
            echo "base_ref=$base_ref"
            echo 'allowed=true'
          } >> "$GITHUB_OUTPUT"
      - name: Create comment token
        id: comment-token
        if: steps.pr.outputs.allowed == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: mlflow
          repositories: mlflow
          permission-issues: write
      - name: Add run link to trigger comment
        if: steps.pr.outputs.allowed == 'true' && github.event_name == 'issue_comment' && steps.comment-token.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.comment-token.outputs.token }}
          REPO: ${{ github.repository }}
          COMMENT_ID: ${{ github.event.comment.id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}?pr=${{ github.event.issue.number }}
        run: |
          marker="<!-- verify-run:$GITHUB_RUN_ID -->"
          body=$(gh api "repos/$REPO/issues/comments/$COMMENT_ID" --jq .body)
          if [[ "$body" != *"$marker"* ]]; then
            body=$(printf '%s\n\n---\n\n[Verification run](%s) %s' "$body" "$RUN_URL" "$marker")
            gh api "repos/$REPO/issues/comments/$COMMENT_ID" -X PATCH -f body="$body" > /dev/null
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.pr.outputs.allowed == 'true'
        with:
          name: verify-context-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/verify-context/pr.json
          if-no-files-found: error
          retention-days: 1

  verify:
    needs: gate
    if: needs.gate.outputs.allowed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: read
    steps:
      # The workflow ref is the default branch for /verify and the selected ref for dispatch.
      - name: Checkout trusted workflow files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false
      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/pull/${{ github.event.issue.number || inputs.pr_number }}/head
          path: pr
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verify-context-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/verify-context
      - uses: ./trusted/.github/actions/setup-python
      - uses: ./trusted/.github/actions/setup-node
      - name: Prepare PR diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ needs.gate.outputs.head }}
          BASE_SHA: ${{ needs.gate.outputs.base }}
        working-directory: pr
        run: |
          if [ "$(git rev-parse HEAD)" != "$HEAD_SHA" ]; then
            echo '::error::PR head changed before checkout; run /verify again.'
            exit 1
          fi
          merge_base=$(gh api "repos/$REPO/compare/$BASE_SHA...$HEAD_SHA" \
            --jq '.merge_base_commit.sha | select(test("^[0-9a-f]{40}$"))')
          [ -n "$merge_base" ]
          git fetch --no-tags --depth=1 origin "$merge_base"
          git diff --no-ext-diff --no-textconv "$merge_base" "$HEAD_SHA" -- \
            > "$RUNNER_TEMP/verify-context/diff.patch"
      - name: Annotate PR diff
        run: |
          uv run --quiet --directory trusted/.claude/skills --package skills skills annotate-diff \
            < "$RUNNER_TEMP/verify-context/diff.patch" > "$RUNNER_TEMP/verify-context/diff.annotated"
      - name: Install agent tools
        run: |
          trusted/.claude/scripts/install-claude.sh
          trusted/.claude/scripts/install-agent-browser.sh
          sudo apt-get update --error-on=any
          sudo apt-get install -y --no-install-recommends ripgrep ffmpeg
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - id: gateway
        uses: ./trusted/.github/actions/setup-gateway
        with:
          task: pr-verify
          host: ${{ secrets.DATABRICKS_HOST }}
          client-id: ${{ secrets.DATABRICKS_CLIENT_ID }}
          client-secret: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
      - name: Start gateway proxy
        id: gateway-proxy
        env:
          GATEWAY_TOKEN: ${{ steps.gateway.outputs.token }}
          GATEWAY_URL: ${{ steps.gateway.outputs.base-url }}
        run: |
          umask 077
          proxy_token=$(openssl rand -hex 32)
          echo "::add-mask::$proxy_token"
          echo "token=$proxy_token" >> "$GITHUB_OUTPUT"
          printf '%s\n%s\n' "$GATEWAY_TOKEN" "$proxy_token" | env -u GATEWAY_TOKEN \
            GATEWAY_URL="$GATEWAY_URL" node trusted/.claude/sandbox/gateway-proxy.mjs \
            > "$RUNNER_TEMP/verify-gateway-proxy.log" 2>&1 &
          proxy_pid=$!
          unset GATEWAY_TOKEN proxy_token
          echo "$proxy_pid" > "$RUNNER_TEMP/verify-gateway-proxy.pid"
          for _ in $(seq 1 30); do
            if ! kill -0 "$proxy_pid" 2>/dev/null; then
              break
            fi
            if curl -fsS http://127.0.0.1:8080/healthz > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo '::error::Gateway proxy did not become ready.'
          exit 1
      # The proxy holds the telemetry token and forwards only OTLP requests. Set the variable
      # to the <catalog>.<schema>.<table_prefix> of a UC-linked experiment to enable export.
      - id: telemetry
        name: Mint telemetry token
        if: vars.TRIAGE_MLFLOW_TRACE_LOCATION != ''
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
        run: |
          response=$(curl -sS --max-time 15 \
            -u "$DATABRICKS_CLIENT_ID:$DATABRICKS_CLIENT_SECRET" \
            -d grant_type=client_credentials -d scope=all-apis \
            "$DATABRICKS_HOST/oidc/v1/token")
          token=$(jq -r '.access_token // empty' <<< "$response")
          if [ -z "$token" ]; then
            echo "::error::Telemetry token exchange failed: $(jq -r '.error_description // .error // "no access_token"' <<< "$response")"
            exit 1
          fi
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
      - name: Start telemetry proxy
        if: steps.telemetry.outcome == 'success'
        env:
          TELEMETRY_TOKEN: ${{ steps.telemetry.outputs.token }}
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          TRACE_LOCATION: ${{ vars.TRIAGE_MLFLOW_TRACE_LOCATION }}
        run: |
          umask 077
          printf '%s\n' "$TELEMETRY_TOKEN" | env -u TELEMETRY_TOKEN \
            DATABRICKS_HOST="$DATABRICKS_HOST" TRACE_LOCATION="$TRACE_LOCATION" \
            node trusted/.claude/sandbox/otel-proxy.mjs \
            > "$RUNNER_TEMP/verify-telemetry-proxy.log" 2>&1 &
          proxy_pid=$!
          unset TELEMETRY_TOKEN
          echo "$proxy_pid" > "$RUNNER_TEMP/verify-telemetry-proxy.pid"
          for _ in $(seq 1 30); do
            if ! kill -0 "$proxy_pid" 2>/dev/null; then
              break
            fi
            if curl --noproxy '*' -fsS http://127.0.0.1:8081/healthz > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/verify-telemetry-proxy.log"
          echo '::error::Telemetry proxy did not become ready.'
          exit 1
      - name: Prepare agent context
        run: |
          mkdir -p /tmp/verify-home /tmp/verify-out/media /tmp/verify-out/work
          cp trusted/.claude/skills/verify/{SKILL.md,payload.schema.yml} "$RUNNER_TEMP/verify-context/"
          cp trusted/.claude/skills/verify/scripts/init.js "$RUNNER_TEMP/verify-context/"
      - name: Verify PR behavior
        working-directory: pr
        env:
          HOME: /tmp/verify-home
          ANTHROPIC_BASE_URL: http://localhost:8080/anthropic
          ANTHROPIC_AUTH_TOKEN: ${{ steps.gateway-proxy.outputs.token }}
          ANTHROPIC_CUSTOM_HEADERS: ${{ steps.gateway.outputs.custom-headers }}
          ANTHROPIC_DEFAULT_SONNET_MODEL: databricks-claude-sonnet-5
          MODEL: ${{ inputs.model || 'databricks-claude-opus-5-5' }}
          EFFORT: ${{ inputs.effort || 'high' }}
          CLAUDE_CODE_ENABLE_TELEMETRY: ${{ steps.telemetry.outcome == 'success' && '1' || '0' }}
          CLAUDE_CODE_ENHANCED_TELEMETRY_BETA: ${{ steps.telemetry.outcome == 'success' && '1' || '0' }}
          OTEL_TRACES_EXPORTER: ${{ steps.telemetry.outcome == 'success' && 'otlp' || 'none' }}
          OTEL_LOGS_EXPORTER: ${{ steps.telemetry.outcome == 'success' && 'otlp' || 'none' }}
          OTEL_METRICS_EXPORTER: ${{ steps.telemetry.outcome == 'success' && 'otlp' || 'none' }}
          OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
          OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://localhost:8081/v1/traces
          OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: http://localhost:8081/v1/logs
          OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: http://localhost:8081/v1/metrics
          OTEL_LOG_USER_PROMPTS: "1"
          OTEL_LOG_ASSISTANT_RESPONSES: "1"
          OTEL_LOG_TOOL_DETAILS: "1"
          OTEL_LOG_TOOL_CONTENT: "1"
          OTEL_RESOURCE_ATTRIBUTES: github.pr_number=${{ github.event.issue.number || inputs.pr_number }},github.pr_url=${{ github.server_url }}/${{ github.repository }}/pull/${{ github.event.issue.number || inputs.pr_number }},github.run_url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          AGENT_BROWSER_ARGS: --no-sandbox
          AGENT_BROWSER_SCREENSHOT_DIR: /tmp/verify-out/media
        run: |
          session_id=$(cat /proc/sys/kernel/random/uuid)
          export SESSION_ID="$session_id"
          if [ "$CLAUDE_CODE_ENABLE_TELEMETRY" = 1 ]; then
            echo "MLflow telemetry session: \`$session_id\`" >> "$GITHUB_STEP_SUMMARY"
          fi
          token=$(cat /proc/sys/kernel/random/uuid)
          echo "::stop-commands::$token"
          # Safe mode ignores PR-authored settings and skills; load the trusted skill explicitly.
          # shellcheck disable=SC2016 # Expanded by the agent shell.
          timeout 30m setsid bash -c '
            echo "$$" > "$RUNNER_TEMP/verify-agent.pgid"
            exec claude \
              --safe-mode \
              --strict-mcp-config \
              --model "$MODEL" \
              --effort "$EFFORT" \
              --session-id "$SESSION_ID" \
              --max-budget-usd 5 \
              --permission-mode auto \
              --disallowed-tools "WebSearch,WebFetch" \
              --append-system-prompt "$(cat "$RUNNER_TEMP/verify-context/SKILL.md")" \
              --print \
              --verbose \
              --output-format stream-json \
              "Verify the pull request and write the requested payload."
          ' | timeout 31m "$GITHUB_WORKSPACE/trusted/.claude/scripts/stream.sh" || { echo "::$token::"; exit 1; }
          echo "::$token::"
      - name: Stop agent processes
        if: always()
        run: |
          if [ -s "$RUNNER_TEMP/verify-agent.pgid" ]; then
            pgid=$(cat "$RUNNER_TEMP/verify-agent.pgid")
            if [[ "$pgid" =~ ^[1-9][0-9]*$ ]]; then
              kill -KILL -- "-$pgid" 2>/dev/null || true
            fi
          fi
      - name: Stage verification report
        run: |
          python3 - "$RUNNER_TEMP/verify-out" <<'PY'
          import os
          import shutil
          import stat
          import sys
          from pathlib import Path

          os.umask(0o022)
          stage = Path(sys.argv[1])
          stage.mkdir(mode=0o755)
          flags = os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK

          def copy_regular(directory_fd, name, destination, limit):
              fd = os.open(name, flags, dir_fd=directory_fd)
              with os.fdopen(fd, "rb") as source:
                  info = os.fstat(source.fileno())
                  if not stat.S_ISREG(info.st_mode) or info.st_size > limit:
                      raise ValueError(f"Invalid or oversized file: {name}")
                  with destination.open("xb") as target:
                      shutil.copyfileobj(source, target)
                  return info.st_size

          report_fd = os.open("/tmp/verify-out", flags | os.O_DIRECTORY)
          try:
              copy_regular(report_fd, "payload.json", stage / "payload.json", 1_000_000)
              try:
                  media_fd = os.open("media", flags | os.O_DIRECTORY, dir_fd=report_fd)
              except FileNotFoundError:
                  pass
              else:
                  try:
                      names = os.listdir(media_fd)
                      if len(names) > 100:
                          raise ValueError("Too many media files")
                      media_stage = stage / "media"
                      media_stage.mkdir()
                      total = 0
                      for name in names:
                          try:
                              total += copy_regular(media_fd, name, media_stage / name, 100 * 1024 * 1024)
                          except (OSError, ValueError) as e:
                              print(f"Skipping media entry {name!r}: {e}")
                          if total > 200 * 1024 * 1024:
                              raise ValueError("Media files exceed the total size limit")
                  finally:
                      os.close(media_fd)
          finally:
              os.close(report_fd)
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verify-out-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/verify-out
          if-no-files-found: error
          retention-days: 1
      - name: Stop gateway proxy
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/verify-gateway-proxy.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/verify-gateway-proxy.pid")" 2>/dev/null || true
          fi
      - name: Stop telemetry proxy
        if: always() && steps.telemetry.outcome == 'success'
        run: |
          if [ -s "$RUNNER_TEMP/verify-telemetry-proxy.log" ]; then
            cat "$RUNNER_TEMP/verify-telemetry-proxy.log"
          fi
          if [ -f "$RUNNER_TEMP/verify-telemetry-proxy.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/verify-telemetry-proxy.pid")" 2>/dev/null || true
          fi

  publish:
    needs: [gate, verify]
    if: always() && needs.gate.result == 'success' && needs.gate.outputs.allowed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout trusted workflow files
        if: needs.verify.result == 'success'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-python
        if: needs.verify.result == 'success'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.verify.result == 'success'
        with:
          name: verify-out-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/verify-out
      - name: Validate and sanitize review
        id: validate
        if: needs.verify.result == 'success'
        run: |
          payload=/tmp/verify-out/payload.json
          schema=.claude/skills/verify/payload.schema.yml
          uvx check-jsonschema@0.37.4 --schemafile "$schema" "$payload"
          node - "$payload" <<'JS'
          const fs = require("node:fs");
          const path = process.argv[2];
          const review = JSON.parse(fs.readFileSync(path, "utf8"));
          const sanitize = (body) => body.replace(/<!--[\s\S]*?-->|[\u0000-\u0008\u000b-\u001f\u007f-\u009f\u00ad\u200b-\u200f\u202a-\u202e\u2060-\u2064\u2066-\u2069\ufeff\u{e0000}-\u{e007f}]/gu, "");
          review.body = sanitize(review.body);
          for (const comment of review.comments) comment.body = sanitize(comment.body);
          fs.writeFileSync(path, JSON.stringify(review));
          JS
          uvx check-jsonschema@0.37.4 --schemafile "$schema" "$payload"
          jq -j '[.body, .comments[].body] | join("\n\n")' "$payload" |
            uv run --quiet --directory .claude/skills --package skills skills embed-media \
              --check --dir /tmp/verify-out/media
      - name: Embed review media
        id: embed
        if: needs.verify.result == 'success' && (github.event_name != 'workflow_dispatch' || !inputs.dry_run)
        env:
          GH_TOKEN: ${{ secrets.UPLOAD_MEDIA_TOKEN }}
          REPOSITORY_ID: ${{ github.repository_id }}
        run: |
          payload=/tmp/verify-out/payload.json
          while IFS= read -r path; do
            jq -j --argjson path "$path" 'getpath($path)' "$payload" |
              uv run --quiet --directory .claude/skills --package skills skills embed-media \
                --dir /tmp/verify-out/media --repository-id "$REPOSITORY_ID" > "$RUNNER_TEMP/review-body"
            jq --argjson path "$path" --rawfile body "$RUNNER_TEMP/review-body" 'setpath($path; $body)' \
              "$payload" > "$RUNNER_TEMP/payload.json"
            mv "$RUNNER_TEMP/payload.json" "$payload"
          done < <(jq -c '["body"], (.comments | keys[] | ["comments", ., "body"])' "$payload")
      - name: Publish or preview review
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number || inputs.pr_number }}
          HEAD_SHA: ${{ needs.gate.outputs.head }}
          BASE_REF: ${{ needs.gate.outputs.base_ref }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          REVIEW_READY: ${{ needs.verify.result == 'success' && steps.validate.outcome == 'success' && (github.event_name == 'workflow_dispatch' && inputs.dry_run || steps.embed.outcome == 'success') }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
        run: |
          pr=$(gh api "repos/$REPO/pulls/$PR_NUMBER")
          if ! jq -e --arg head "$HEAD_SHA" --arg base "$BASE_REF" \
            '.state == "open" and .head.sha == $head and .base.ref == $base' <<< "$pr" > /dev/null; then
            echo 'PR closed, head changed, or base branch changed; no review will be posted.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          notice="> Automated behavior verification: [$HEAD_SHA]($RUN_URL)."
          if [ "$REVIEW_READY" = true ]; then
            jq --arg sha "$HEAD_SHA" --arg notice "$notice" '{
              commit_id: $sha, event: .event, body: ($notice + "\n\n" + .body), comments: .comments
            }' /tmp/verify-out/payload.json > "$RUNNER_TEMP/review.json"
          else
            jq -n --arg sha "$HEAD_SHA" --arg notice "$notice" '{
              commit_id: $sha, event: "COMMENT",
              body: ($notice + "\n\nVerification did not complete. See the workflow run for details.")
            }' > "$RUNNER_TEMP/review.json"
          fi
          if [ "$DRY_RUN" = true ]; then
            {
              echo '### Verification preview'
              echo 'No review or media was published. Local media paths are not GitHub links.'
              jq . "$RUNNER_TEMP/review.json" | jq -Rrs '"<pre>\(. | @html)</pre>"'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            gh api "repos/$REPO/pulls/$PR_NUMBER/reviews" -X POST \
              --input "$RUNNER_TEMP/review.json" --jq .html_url
          fi
