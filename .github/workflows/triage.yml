name: Triage

on:
  issues:
    types: [opened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

permissions: {}
cache-mode: none

jobs:
  security_gate:
    if: github.repository == 'mlflow/mlflow'
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      issues: write
    outputs:
      security_match: ${{ steps.security.outputs.match }}
    steps:
      - id: security
        env:
          SECURITY_MATCH: ${{ contains(github.event.issue.title, 'security') && contains(github.event.issue.title, 'vulnerability') }}
        run: echo "match=$SECURITY_MATCH" >> "$GITHUB_OUTPUT"
      - if: steps.security.outputs.match == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          gh issue close "$ISSUE_NUMBER" --repo "$REPO" --comment "$(cat <<'EOF'
          This issue has been automatically closed because it appears to report a security vulnerability.

          Please report security vulnerabilities through [GitHub's private vulnerability reporting](https://github.com/mlflow/mlflow/security/advisories/new) instead. See our [Security Policy](https://github.com/mlflow/mlflow/blob/master/SECURITY.md) for more details.
          EOF
          )"
  label:
    needs: security_gate
    if: >-
      github.repository == 'mlflow/mlflow' &&
      needs.security_gate.outputs.security_match != 'true' &&
      github.event.issue.labels[0] == null
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          TITLE: ${{ github.event.issue.title }}
        run: |
          title="${TITLE#"${TITLE%%[![:space:]]*}"}"
          case "${title^^}" in
            "[BUG]"* | "[SETUP-BUG]"*) labels="bug" ;;
            "[FR]"*) labels="enhancement" ;;
            "[DOC-FIX]"*) labels="bug,area/docs" ;;
            *) echo "No matching title prefix"; exit 0 ;;
          esac
          gh issue edit "$ISSUE_URL" --add-label "$labels"
