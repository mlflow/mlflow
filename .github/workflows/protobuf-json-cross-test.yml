name: Protobuf JSON cross tests

on:
  pull_request:
    paths:
      - mlflow/utils/proto_json_utils.py
      - "mlflow/protos/**"
      - tests/utils/test_proto_json_utils.py
      - "tests/protos/**"
      - pyproject.toml
      - uv.lock
      - .github/workflows/protobuf-json-cross-test.yml
  push:
    branches:
      - master
      - branch-[0-9]+.[0-9]+
    paths:
      - mlflow/utils/proto_json_utils.py
      - "mlflow/protos/**"
      - tests/utils/test_proto_json_utils.py
      - "tests/protos/**"
      - pyproject.toml
      - uv.lock
      - .github/workflows/protobuf-json-cross-test.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

permissions: {}
cache-mode: none

jobs:
  test:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        protobuf_major_version: [3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python
      - name: Install dependencies
        env:
          PROTOBUF_MAJOR_VERSION: ${{ matrix.protobuf_major_version }}
        run: |
          uv sync --locked --no-default-groups --group pytest
          uv pip install pip "protobuf==$PROTOBUF_MAJOR_VERSION.*"
      - name: Run serialization tests
        run: uv run --no-sync pytest tests/utils/test_proto_json_utils.py -k message_to_json
