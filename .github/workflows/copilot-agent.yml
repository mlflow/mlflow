name: Copilot Agent

on:
  pull_request_target:
    types: [review_requested]

concurrency:
  group: ${{ github.run_id }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

permissions: {}

jobs:
  # The coding agent signals it is done by requesting a review on its own PR
  # while that PR is still a draft.
  publish-draft:
    if: >-
      github.event.pull_request.draft == true
      && github.event.pull_request.user.login == 'Copilot'
      && github.event.pull_request.user.type == 'Bot'
      && github.event.sender.login == 'Copilot'
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions: {}
    steps:
      # An app token, not `secrets.GITHUB_TOKEN`: the `ready_for_review` this
      # publish emits has to reach `copilot-review.yml`, and events created with
      # `GITHUB_TOKEN` never trigger another workflow run.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          # `markPullRequestReadyForReview` rejects `pull-requests: write`
          # alone. See https://github.com/cli/cli/issues/8910.
          permission-contents: write
          permission-pull-requests: write

      - name: Mark ready for review
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr ready "$PR_NUMBER" --repo "$REPO"

  # `closingIssuesReferences` is not in the webhook payload, so it has to be
  # fetched. It covers both ways the link gets made: a closing keyword in the
  # PR body, and the native link from assigning the issue to Copilot.
  comment-on-linked-issues:
    needs: publish-draft
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      issues: write
      pull-requests: read
    steps:
      - name: Comment on linked issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          marker="<!-- copilot-agent-pr:${PR_NUMBER} -->"
          body=$(printf 'Copilot opened #%s for this issue.\n\n%s' "$PR_NUMBER" "$marker")
          response=$(gh api graphql -F owner="$OWNER" -F name="${REPO#*/}" -F number="$PR_NUMBER" -f query='
            query($owner: String!, $name: String!, $number: Int!) {
              repository(owner: $owner, name: $name) {
                pullRequest(number: $number) {
                  closingIssuesReferences(first: 10) {
                    nodes {
                      number
                      comments(last: 100) {
                        nodes {
                          body
                        }
                      }
                    }
                  }
                }
              }
            }')
          issues=$(printf '%s' "$response" | jq --arg marker "$marker" -r '
            .data.repository.pullRequest.closingIssuesReferences.nodes[]
            | select(any(.comments.nodes[]; .body | contains($marker)) | not)
            | .number')

          if [ -z "$issues" ]; then
            echo "No linked issues."
            exit 0
          fi

          for issue in $issues; do
            gh issue comment "$issue" --repo "$REPO" \
              --body "$body"
          done
