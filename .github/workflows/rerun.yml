# Triggers rerun-workflow-run.yml on PR approval.
# See https://stackoverflow.com/questions/67247752/how-to-use-secret-in-pull-request-review-similar-to-pull-request-target for why we need this approach and how it works.
name: rerun

on:
  pull_request_review:
    types: [submitted]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

permissions: {}

jobs:
  # This job exists only so that rerun-workflow-run.yml has a completed run to
  # react to. It carries no payload: that workflow reads the PR head SHA from
  # `github.event.workflow_run.head_sha`.
  approved:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions: {}
    if: >-
      github.event.review.state == 'approved' &&
      (
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.review.author_association) ||
        (github.event.review.user.type == 'Bot' && contains(fromJSON('["mlflow-app[bot]", "nailaopus[bot]"]'), github.event.review.user.login))
      )
    steps:
      - run: echo "Approved, triggering rerun-workflow-run.yml"
