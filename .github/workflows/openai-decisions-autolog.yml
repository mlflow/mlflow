name: OpenAI Decisions autologging

on:
  pull_request:
    paths:
      - ".github/workflows/openai-decisions-autolog.yml"
      - "mlflow/openai/**"
      - "tests/openai/**"
      - "pyproject.toml"
  push:
    branches:
      - master
      - branch-[0-9]+.[0-9]+
    paths:
      - ".github/workflows/openai-decisions-autolog.yml"
      - "mlflow/openai/**"
      - "tests/openai/**"
      - "pyproject.toml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  MLFLOW_HOME: ${{ github.workspace }}
  MLFLOW_SERVER_ENABLE_JOB_EXECUTION: "false"
  PIP_CONSTRAINT: ${{ github.workspace }}/requirements/constraints.txt

permissions: {}
cache-mode: none

jobs:
  decisions:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python
      - name: Install dependencies
        run: |
          # v3.26.0 release commit: the first OpenAI SDK with the Decisions resource.
          uv pip install --system . pytest pytest-asyncio pytest-timeout \
            'openai @ git+https://github.com/openai/openai-python.git@4e152cdefe1844c2d5d78653310e9b9c0195c44e'
      - name: Run tests
        run: |
          python -c 'from importlib.metadata import version; assert version("openai") == "3.26.0"; import openai.resources.decisions, httpx2'
          python -m pytest tests/openai/test_openai_decisions_autolog.py
