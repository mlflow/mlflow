name: Retry

on:
  schedule:
    # Weekdays, 09:17–17:47 JST.
    - cron: "17,47 0-8 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print eligible reruns without submitting them
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow_ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

permissions: {}
cache-mode: none

jobs:
  rerun:
    if: github.repository == 'mlflow/mlflow'
    runs-on: ubuntu-slim
    timeout-minutes: 15
    permissions:
      pull-requests: read # to find candidate PRs
      actions: write # to rerun workflows
    steps:
      - name: Fetch rerun script
        env:
          GH_REPO: ${{ github.repository }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            "https://raw.githubusercontent.com/$GH_REPO/$WORKFLOW_SHA/.github/workflows/retry.sh" \
            --output "$RUNNER_TEMP/retry.sh"

      - name: rerun
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          MAX_ATTEMPTS: "5"
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: |
          # TODO: Extend eligibility to other bot and human PRs.
          candidates=$(gh api graphql --paginate \
            -f search="repo:$GH_REPO is:pr is:open author:app/copilot-swe-agent" \
            -f query='
              query($search: String!, $endCursor: String) {
                search(query: $search, type: ISSUE, first: 100, after: $endCursor) {
                  nodes {
                    ... on PullRequest {
                      number
                      isDraft
                      mergeable
                      headRefOid
                      autoMergeRequest { enabledAt }
                      latestOpinionatedReviews(first: 100) {
                        nodes { state authorAssociation }
                      }
                      commits(last: 1) {
                        nodes { commit { committedDate } }
                      }
                    }
                  }
                  pageInfo { hasNextPage endCursor }
                }
              }' \
            --jq '.data.search.nodes[] |
              select(.isDraft == false and .autoMergeRequest != null) |
              select(.mergeable != "CONFLICTING") |
              select(any(.latestOpinionatedReviews.nodes[];
                .state == "APPROVED" and
                (.authorAssociation == "OWNER" or .authorAssociation == "MEMBER" or .authorAssociation == "COLLABORATOR")
              )) |
              select((.commits.nodes[0].commit.committedDate | fromdateiso8601) >= (now - 3 * 24 * 60 * 60)) |
              [.number, .headRefOid] | @tsv')

          args=()
          if [[ "$DRY_RUN" == true ]]; then
            args+=(--dry-run)
          fi

          result=0
          while IFS=$'\t' read -r number sha; do
            [[ -n "$number" ]] || continue
            echo "::group::PR #$number"
            if ! bash "$RUNNER_TEMP/retry.sh" "${args[@]}" "$GH_REPO" "$sha"; then
              result=1
            fi
            echo "::endgroup::"
          done <<< "$candidates"
          exit "$result"
