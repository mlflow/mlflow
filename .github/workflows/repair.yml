name: Repair

on:
  schedule:
    # Run every 20 minutes.
    - cron: "*/20 * * * *"
      timezone: Asia/Tokyo
  workflow_dispatch:
    inputs:
      pr_numbers:
        description: "Comma-separated PR numbers; leave empty to search"
        type: string
        required: false
        default: ""
      dry_run:
        description: Print eligible reruns without submitting them
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow_ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

permissions: {}
cache-mode: none

jobs:
  rerun:
    if: github.repository == 'mlflow/mlflow'
    runs-on: ubuntu-slim
    timeout-minutes: 15
    permissions:
      pull-requests: read # to find candidate PRs
      actions: write # to rerun workflows
    steps:
      - name: Fetch repair scripts
        run: |
          for script in .claude/skills/repair/scripts/cli.py .github/workflows/retry.sh; do
            curl -fsSL --retry 3 --connect-timeout 10 --max-time 30 \
              --write-out 'curl: %{time_total}s\n' \
              "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/$script" \
              -o "$RUNNER_TEMP/${script##*/}"
          done

      - name: rerun
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          MAX_RETRIES: "3"
          PR_NUMBERS: ${{ inputs.pr_numbers }}
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: |
          candidate_json=$(python3 "$RUNNER_TEMP/cli.py" discover)
          candidates=$(jq -r '.[] | [.number, .sha] | @tsv' <<< "$candidate_json")

          args=()
          if [[ "$DRY_RUN" == true ]]; then
            args+=(--dry-run)
          fi

          result=0
          while IFS=$'\t' read -r number sha; do
            [[ -n "$number" ]] || continue
            echo "::group::https://github.com/$GH_REPO/pull/$number"
            if ! bash "$RUNNER_TEMP/retry.sh" "${args[@]}" "$GH_REPO" "$sha"; then
              result=1
            fi
            echo "::endgroup::"
          done <<< "$candidates"
          exit "$result"
