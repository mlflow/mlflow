name: "setup-node"
description: "Set up Node"
inputs:
  node-version:
    description: "Node version to use."
    default: "24"
    required: false

runs:
  using: "composite"
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.node-version }}
    - run: |
        # npm >= 12 blocks dependency lifecycle scripts by default unless allowed by allowScripts.
        # https://github.com/npm/cli/releases/tag/v12.0.0
        npm install -g npm@12.0.1
      shell: bash
