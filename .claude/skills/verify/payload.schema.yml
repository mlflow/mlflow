$schema: https://json-schema.org/draft/2020-12/schema
title: PR Behavior Verification Review
description: |
  Write /tmp/verify-out/payload.json as a JSON object matching this schema. Never request changes,
  create a review, or approve the PR yourself. Avoid @-mentions.

  Save useful screenshots or recordings in /tmp/verify-out/media and cite their exact absolute
  paths in the review body or an inline comment, for example:
  ![Observed behavior](/tmp/verify-out/media/observed.png)
  Put a video citation on its own line. The workflow uploads cited media and replaces the paths;
  do not upload media yourself.

  Before finishing, validate the payload with:
  uvx check-jsonschema@0.37.4 --schemafile "$RUNNER_TEMP/verify-context/payload.schema.yml" /tmp/verify-out/payload.json
  Fix validation errors before finishing.
type: object
additionalProperties: false
required:
  - event
  - body
  - comments
properties:
  event:
    description: >-
      Choose APPROVE only when you directly verified the PR's material intended behavior and found
      no significant behavioral problems. Choose COMMENT for an established significant problem
      or when important behavior could not be verified. A lack of findings is not evidence that a
      change works.
    type: string
    enum:
      - APPROVE
      - COMMENT
  body:
    description: >-
      Always use one to three short sentences: state the outcome and the most important behavior
      checked or material gap. Do not restate the PR, list every command, or repeat findings in
      comments. Briefly summarize a finding here if it cannot be placed on a relevant diff line.
    type: string
    minLength: 1
    maxLength: 400
    pattern: \S
  commit_id:
    description: Optional head SHA; the workflow always sets the pinned head when publishing.
    type: string
    pattern: ^[0-9a-f]{40}$
  comments:
    description: >-
      Put each significant behavioral finding in an inline comment on the most relevant line in a
      PR diff hunk whenever possible. If the issue is outside the diff, use the most relevant diff
      line as the anchor and identify the affected location in the comment. Comments can also show
      evidence next to the relevant change.
    type: array
    maxItems: 10
    items:
      $ref: "#/$defs/comment"
$defs:
  side:
    type: string
    enum:
      - LEFT
      - RIGHT
  comment:
    type: object
    additionalProperties: false
    required:
      - path
      - body
      - line
      - side
    properties:
      path:
        description: Repository-relative path with a hunk in the PR diff.
        type: string
        minLength: 1
        maxLength: 1024
        pattern: \S
      body:
        description: >-
          Describe the trigger, expected and actual behavior, and consequence of a significant
          behavioral finding, or show evidence relevant to the change.
        type: string
        minLength: 1
        maxLength: 3000
        pattern: \S
      line:
        description: Last line of the comment, inside a diff hunk on the chosen side.
        type: integer
        minimum: 1
      side:
        description: RIGHT for added or context lines; LEFT for deleted or context lines.
        $ref: "#/$defs/side"
      start_line:
        description: First line of a multi-line comment; must be before line and in the same hunk.
        type: integer
        minimum: 1
      start_side:
        description: Side of start_line in the same hunk as line.
        $ref: "#/$defs/side"
    dependentRequired:
      start_line:
        - start_side
      start_side:
        - start_line
