$schema: https://json-schema.org/draft/2020-12/schema
title: PR Code Review and Behavior Verification
description: |
  Write the review payload as JSON for the workflow to publish. Avoid @-mentions.

  Save screenshots or recordings in the supplied temporary directory's out/media folder.
  Cite evidence of a finding or verification gap in its inline comment using an absolute path.
  ![Observed behavior](/absolute/path/to/out/media/observed.png)
  Cite media showing expected behavior in the body's evidence section, including base/PR
  comparisons. Put each video citation on its own line. The workflow handles uploads.
type: object
additionalProperties: false
required:
  - event
  - body
  - comments
allOf:
  - if:
      properties:
        event:
          const: APPROVE
    then:
      properties:
        comments:
          maxItems: 0
properties:
  event:
    description: |
      Choose APPROVE only when both conditions hold.

      1. Code review is complete and no material finding remains open. A finding is material
         when its consequence warrants a fix or investigation before merge. Any evidence label
         can apply. For a Plausible finding, identify the specific unresolved condition that
         could cause that consequence. Include findings already raised in review threads.
      2. Runtime verification is complete for all locally exercisable changed flows. You
         observed changed behavior through the user's interface and the results matched
         expectations. For bug fixes, reproduce the failure on the base with the same input.
         A flow seen only in tests is unverified.

      Choose COMMENT if either condition is unmet.
    type: string
    enum:
      - APPROVE
      - COMMENT
  body:
    description: |
      Summarize the runtime checks, observed results, and any unverified flows in a few
      sentences. For flows that inherently require a real service, credentials, hardware, or
      scale, say what verification would require. Give the code-review conclusion separately.

      To show media of verified behavior, end the body with a collapsed section, giving each
      citation a short caption saying what it shows. Keep the blank lines around the content
      so GitHub renders it:

      ```markdown
      <details><summary>Evidence</summary>

      Base: <behavior observed on the base build>
      ![Base behavior](/absolute/path/to/out/media/base.png)

      PR: <behavior observed on the PR build>
      ![PR behavior](/absolute/path/to/out/media/pr.png)

      </details>
      ```
    type: string
    minLength: 1
    maxLength: 3000
    pattern: \S
  commit_id:
    description: Optional PR head SHA.
    type: string
    pattern: ^[0-9a-f]{40}$
  comments:
    description: >-
      Report material findings and checks that should work locally but remain blocked after
      recovery attempts. Anchor each distinct issue or gap to the most relevant diff line.
      Use an empty array when there is nothing new to report.
      If the failure surfaces outside the diff, name that location in the comment.
    type: array
    maxItems: 10
    items:
      $ref: "#/$defs/comment"
$defs:
  side:
    type: string
    enum:
      - LEFT
      - RIGHT
  comment:
    type: object
    additionalProperties: false
    required:
      - path
      - body
      - line
      - side
    properties:
      path:
        description: Repository-relative path with a hunk in the PR diff.
        type: string
        minLength: 1
        maxLength: 1024
        pattern: \S
      body:
        description: |
          Label each finding Runtime-confirmed when observed through the affected interface,
          Code-supported when the code establishes a correctness or maintainability issue,
          or Plausible when a concrete failure depends on an unverified condition. For a Plausible finding,
          identify that condition and what would settle it. Omit unsupported speculation.
          For fixable findings, use the following format and include a `suggestion` block when possible.

          ````markdown
          **🐛 Issue:** <Evidence label>. <What is wrong, why it matters, and the evidence.>

          **🔧 Fix:** <Recommended change.>

          ```suggestion
          <Replacement code>
          ```
          ````

          For verification gaps, state what you tried and couldn't verify.
          Use Mermaid when helpful. Prefer code permalinks over `<path>:<line>` references.
        type: string
        minLength: 1
        maxLength: 3000
        pattern: \S
      line:
        description: Last line of the comment, inside a diff hunk on the chosen side.
        type: integer
        minimum: 1
      side:
        description: RIGHT for added or context lines; LEFT for deleted or context lines.
        $ref: "#/$defs/side"
      start_line:
        description: First line of a multi-line comment; must precede line in diff order, in the same hunk.
        type: integer
        minimum: 1
      start_side:
        description: Side of start_line in the same hunk as line.
        $ref: "#/$defs/side"
    dependentRequired:
      start_line:
        - start_side
      start_side:
        - start_line
    # A range cannot start on the new side and end on the old side.
    if:
      required:
        - start_side
      properties:
        start_side:
          const: RIGHT
    then:
      properties:
        side:
          const: RIGHT
