$schema: https://json-schema.org/draft/2020-12/schema
title: Feature Request Triage Payload
description: Implementation effort, impact on existing features, and checks needed before proceeding.
type: object
additionalProperties: false
required:
  - verdict
  - comment
properties:
  issue_title:
    description: Optional descriptive replacement for a blank, template-only, or vague issue title.
    type: string
    pattern: '^[^\r\n]+$'
    minLength: 1
    maxLength: 120
  verdict:
    type: string
    oneOf:
      - const: "triage: feasible"
        description: The feature appears implementable with a concrete approach and no unresolved design decisions.
      - const: "triage: already-supported"
        description: The requested behavior is available at the current checkout.
      - const: "triage: needs-info"
        description: The request lacks enough information to understand the intended behavior.
      - const: "triage: needs-design"
        description: Maintainers need to resolve design choices or trade-offs.
      - const: "triage: skipped"
        description: Triage needs resources the sandbox lacks.
  comment:
    description: |
      Markdown comment for initial feature triage. Replace placeholders and omit
      sections with nothing to say, except the verdict. Omit boilerplate about tests
      not run or PRs not proposed.

      ### Summary

      **<verdict>**: <the requested behavior and triage in one or two sentences>.

      ### Implementation effort

      <small, medium, or large, with a brief reason and the main changes with code permalinks>

      <if a prototype was attempted: 1–2 sentences on the result and blockers>

      <for a small change: the core change in a fenced diff code block; state whether it was tried>

      ### Impact on existing features

      <the main effects on existing behavior or compatibility>

      ### Checks needed

      <key open decisions and suggested tests or manual checks; distinguish checks
      performed from those still needed>
    type: string
    minLength: 1
    maxLength: 5000
