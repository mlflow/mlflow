$schema: https://json-schema.org/draft/2020-12/schema
title: Triage Follow-up
description: |
  Optional follow-up instructions from a maintainer whose permission the workflow has verified.
  Null for triage without a follow-up request.
type: [object, "null"]
additionalProperties: false
required:
  - instructions
  - command_url
  - maintainer
properties:
  instructions:
    description: Instructions without the /triage prefix; empty for a plain /triage rerun.
    type: string
  command_url:
    description: URL of the triggering issue comment or manual workflow run.
    type: string
    format: uri
    pattern: "^https://[^/\\s]+/\\S+$"
    minLength: 1
  maintainer:
    description: GitHub login of the authenticated requester.
    type: string
    minLength: 1
