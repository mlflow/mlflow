$schema: https://json-schema.org/draft/2020-12/schema
title: Bug Triage Follow-up Payload
description: A reply to a maintainer's follow-up request, with an optional verified fix proposal.
type: object
additionalProperties: false
required:
  - comment
properties:
  comment:
    description: |
      A brief, free-form reply in 2–4 short sentences and at most 100 words. State the outcome,
      summarize verification, and mention any blocker or important behavior change. Do not
      repeat the original triage report or include tables, code blocks, or test commands.
      Put reproduction steps and detailed verification in pull_request.body when proposing
      a fix. A pull_request is only a proposal; do not claim it has been opened.
    type: string
    minLength: 1
    maxLength: 800
  pull_request:
    description: A PR proposal for fix.patch, only after reproducing the bug and verifying the fix.
    type: object
    additionalProperties: false
    required:
      - title
      - body
    properties:
      title:
        description: One-line PR title.
        type: string
        pattern: "^[^\\r\\n]+$"
        minLength: 1
        maxLength: 120
      body:
        description: PR body following .github/pull_request_template.md.
        type: string
        minLength: 1
        maxLength: 20000
