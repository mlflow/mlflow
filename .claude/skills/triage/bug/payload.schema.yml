$schema: https://json-schema.org/draft/2020-12/schema
title: Triage Payload
description: Payload written by the triage skill to <out_dir>/payload.json.
type: object
additionalProperties: false
required:
  - label
  - comment
properties:
  label:
    description: Bug triage outcome label.
    type: string
    enum:
      # The bug exists at the current checkout.
      - "triage: reproduced"
      # The reported version reproduces it, but the current checkout does not.
      - "triage: already-fixed"
      # Neither version reproduces it with the information given.
      - "triage: not-reproduced"
      # The issue is too incomplete to attempt a reproduction.
      - "triage: needs-info"
      # Reproduction needs resources the sandbox lacks.
      - "triage: skipped"
  comment:
    description: Markdown comment for the issue, following the template in README.md.
    type: string
    minLength: 1
    maxLength: 5000
