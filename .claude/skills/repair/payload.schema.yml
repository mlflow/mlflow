$schema: https://json-schema.org/draft/2020-12/schema
title: Repair payload
type: object
additionalProperties: false
required: [summary, actions]
properties:
  summary:
    description: Diagnosis and rationale for the proposed actions in one or two sentences.
    type: string
    minLength: 1
    maxLength: 500
    pattern: '\S'
  actions:
    description: >-
      Leave empty when no supported action would help or the evidence is insufficient.
    type: array
    maxItems: 1
    items:
      oneOf:
        - type: object
          description: >-
            Rerun failed jobs for captured workflow runs with transient failures.
            One action can include multiple runs.
          additionalProperties: false
          required: [type, run_ids]
          properties:
            type:
              const: rerun
            run_ids:
              type: array
              minItems: 1
              uniqueItems: true
              items:
                type: integer
                minimum: 1
