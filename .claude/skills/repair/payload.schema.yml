$schema: https://json-schema.org/draft/2020-12/schema
title: Repair payload
type: object
additionalProperties: false
required: [rationale, action]
properties:
  rationale:
    description: Diagnosis and the reason for the chosen action, or for taking none, in one or two sentences.
    type: string
    minLength: 1
    maxLength: 500
    pattern: '\S'
  action:
    description: >-
      The one action to take. Use null when no supported action would help or the evidence is
      insufficient.
    oneOf:
      - type: "null"
      - type: object
        description: >-
          Rerun failed jobs for captured workflow runs with transient failures, such as network
          errors or flaky tests. A rerun tests the same commit again. One action can include
          multiple runs.
        additionalProperties: false
        required: [type, run_ids]
        properties:
          type:
            const: rerun
          run_ids:
            type: array
            minItems: 1
            uniqueItems: true
            items:
              type: integer
              minimum: 1
      - type: object
        description: Push a commit to the PR branch. Pushing starts a new CI run.
        additionalProperties: false
        required: [type, merge_base]
        properties:
          type:
            const: push
          merge_base:
            description: |-
              Merge the latest base branch (`base_ref` in the context) into the PR branch. Use
              when:

              - The failures are unrelated to the PR's changes and a base branch commit newer than
                the PR's base (`base_sha` in the context) fixes them. List those commits with:
                ```
                gh api repos/mlflow/mlflow/compare/<base_sha>...<base_ref> \
                  --jq '.commits[] | "\(.sha) \(.commit.message | split("\n")[0])"'
                ```
            const: true
      - type: object
        description: >-
          Push a code fix, written to `fix.patch` in the output directory, for failures the PR's
          changes cause. Pushing starts a new CI run.
        additionalProperties: false
        required: [type, commit_message]
        properties:
          type:
            const: fix
          commit_message:
            type: string
            maxLength: 100
            pattern: '^[^\n]*\S[^\n]*$'
