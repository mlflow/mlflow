[mlflow]
# Default permission level for unauthenticated requests
# Options: read, edit, manage, admin
default_permission = read

# Database URI for storing user/permission data
# Using SQLite for development, use PostgreSQL for production
database_uri = sqlite:///mlflow_auth.db

# Admin user credentials (required on first start)
# Change these to secure values!
admin_username = admin
admin_password = your_secure_admin_password

# Custom authorization function for Azure SSO
# This function handles Azure AD authentication
authorization_function = mlflow.server.auth.azure_auth:authenticate_request_azure

# Grant all users default workspace access
grant_default_workspace_access = true

# Authentication cache settings
# Cache size: max number of entries
auth_cache_max_size = 10000

# Cache TTL in seconds (0 = disabled)
# Enables caching of authentication decisions for faster requests
# Set to 0 for development (no caching), 3600+ for production
auth_cache_ttl_seconds = 3600

# Workspace cache settings (for multi-tenant deployments)
workspace_cache_max_size = 10000
workspace_cache_ttl_seconds = 3600

# Optional: Read-only database for analytics (can point to replica)
# read_database_uri = postgresql://user:pass@read-replica:5432/mlflow
